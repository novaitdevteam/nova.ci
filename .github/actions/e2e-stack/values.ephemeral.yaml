  ENGINE_AWS_S3_REGION: eeur
  ENGINE_AWS_S3_FORCE_PATH_STYLE: 'true'
  UI_VITE_APP_INFO_PANEL_TECH_SUPPORT_URL: http://localhost:8080/app/accounts/1/profile/settings
  UI_VITE_APP_WEBSOCKET_URL: http://localhost:8080
  UI_VITE_APP_VAPID_PUBLIC_KEY: e2e-ephemeral-not-a-real-secret
