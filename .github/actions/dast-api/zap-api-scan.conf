# nova.ci — OWASP ZAP authenticated API scan triage register
#
# This file decides what a zap-api-scan finding MEANS. It is a separate register from
# .github/actions/dast/zap-baseline.conf on purpose: api-scan runs authenticated, against
# every route the OpenAPI spec declares, so it reaches findings the unauthenticated
# baseline never can — the two rule sets are not interchangeable, and neither is this
# file with that one. Every rule loads at its own default (mostly WARN); an entry here
# overrides that for one rule ID.
#
#   FAIL    must be fixed — counted and reported separately from warnings
#   WARN    the default — no entry needed
#   INFO    noted, not a warning — out of the warning count, still in the report
#   IGNORE  accepted risk — write the reason; see the note below
#   PASS    treated as passing
#
# TAB-separated, three fields minimum:
#
#   <rule_id>	<LEVEL>	<why this decision was made, and who accepted it>
#
# The reason is a review-time obligation, not a parsed one: scan.sh wants three
# tab-separated fields and accepts an empty third, because ZAP accepts it too and this
# validator must never reject a register ZAP would load. Nothing here will stop an
# unexplained IGNORE; the pull request is what stops it.
#
# A rule can also be scoped out for particular URLs only:
#
#   <id>,<id>	OUTOFSCOPE	<regex matched against the alert URL>
#
# Worked example — illustrative only, do not uncomment:
#
#   10038	IGNORE	CSP is terminated at the ingress, not in the app — NC2-XXXX, IS manager
#
# Rule IDs are NOT written from memory. Run the pinned image against a live instance of
# the spec and copy the ones actually loaded:
#
#   docker run --rm -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
#       zap-api-scan.py -t http://example.com/api-docs-json -f openapi -S -g zap-rules.conf
#
# Known limit: a well-formed line naming a rule ID that does not exist is silently
# inert. ZAP reports alert counts per bucket, never which configured IDs matched, so an
# IGNORE that applied and an IGNORE that was mistyped are indistinguishable. scan.sh
# validates the shape of every line; it cannot validate the IDs.
#
# No entries yet: the mechanism, not the policy. Adding a line is a decision to accept,
# escalate or downgrade a class of finding, and belongs to whoever signs the quarterly
# report.
