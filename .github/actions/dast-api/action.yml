name: "OWASP ZAP authenticated API scan"
description: "Boot novatalks.core's engine against ephemeral postgres/redis, seed and log in as the admin, and run zap-api-scan.py in safe mode against the engine's own OpenAPI spec"

inputs:
  image:
    description: "Full image reference to boot and scan"
    required: true
  boot-timeout:
    description: "Seconds to wait for the first HTTP response on /livez before giving up — the engine's own startupProbe budget"
    required: false
    default: "300"
  report-file:
    description: "Path the .report is written to"
    required: true
  report-url:
    description: "Public URL the report will be published at, for the notifier line"
    required: false
    default: ""

outputs:
  outcome:
    description: "clean | findings | not-run | error — a failed boot, migration, seed or login is not a clean scan"
    value: ${{ steps.scan.outputs.outcome }}
  findings:
    description: "Number of WARN-level zap-api-scan findings"
    value: ${{ steps.scan.outputs.findings }}
  failures:
    description: "Number of FAIL-level zap-api-scan findings — those the triage register marks as must-fix"
    value: ${{ steps.scan.outputs.failures }}
  message:
    description: "Ready-to-send notifier text"
    value: ${{ steps.scan.outputs.message }}

runs:
  using: composite
  steps:
    # Pinned by digest for the same reason Gitleaks, Semgrep and the baseline DAST scan
    # are — same image and same pin as .github/actions/dast/action.yml, since it is the
    # same ZAP install driven a different way.
    # To upgrade: docker buildx imagetools inspect ghcr.io/zaproxy/zaproxy:stable --format '{{.Manifest.Digest}}'
    - name: Boot, seed, log in, and scan
      id: scan
      shell: bash
      env:
        DAST_IMAGE: ${{ inputs.image }}
        DAST_BOOT_TIMEOUT: ${{ inputs.boot-timeout }}
        ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef"
        DAST_REPORT_FILE: ${{ inputs.report-file }}
        REPORT_URL: ${{ inputs.report-url }}
        DAST_ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bash "${DAST_ACTION_ROOT}/scan.sh"
