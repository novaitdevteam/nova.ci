name: "OWASP ZAP authenticated API scan"
description: "Boot novatalks.core's engine against ephemeral postgres/redis, seed and log in as the admin, and run zap-api-scan.py in safe mode against the engine's own OpenAPI spec"

inputs:
  image:
    description: "Full image reference to boot and scan"
    required: true
  boot-timeout:
    description: "Seconds to wait for the first HTTP response on /livez before giving up — the engine's own startupProbe budget"
    required: false
    default: "300"
  port:
    description: "TCP port the application listens on and ZAP scans"
    required: false
    default: "3000"
  health-path:
    description: "Path polled until the container answers, before migration/seed proceeds to login or scan"
    required: false
    default: "/livez"
  spec-path:
    description: "Path serving the OpenAPI spec zap-api-scan.py drives the scan from"
    required: false
    default: "/api-docs-json"
  auth-mode:
    description: "How the scan acquires its token: login (POST username/password, read the token from the response), db-token (read a token straight out of the seeded database with a caller-supplied SELECT), db-insert (write a generated token into the seeded database with a caller-supplied INSERT, rather than depending on whatever key the image's own seeder happened to write), or env-token (generate a token before the container starts and hand it in as an environment variable, for an app that accepts any token present in a var it reads at boot — no database involved)"
    required: false
    default: "login"
  scan-mode:
    description: "passive (default) observes only, via zap-api-scan.py's -S safe mode. active drops -S and sends real POST/PUT/DELETE and injection payloads — only ever against the ephemeral stack this action starts and kills."
    required: false
    default: "passive"
  login-path:
    description: "POST route used to log in when auth-mode is login"
    required: false
    default: "/auth/sign_in"
  auth-header:
    description: "Request header ZAP injects the token under"
    required: false
    default: "Authorization"
  auth-scheme-prefix:
    description: "Prefix ZAP prepends to the token when injecting it — note the trailing space in the default; empty for a raw token"
    required: false
    default: "Bearer "
  token-sql:
    description: "SELECT run against the seeded database when auth-mode is db-token; required in that mode"
    required: false
    default: ""
  token-insert-sql:
    description: "INSERT run against the seeded database when auth-mode is db-insert; %TOKEN% is replaced with a token generated for this run. Required in that mode."
    required: false
    default: ""
  token-env-var:
    description: "Environment variable the application reads its accepted API tokens from, when auth-mode is env-token. Required in that mode. novatalks.dialer uses API_ACCESS_TOKENS."
    required: false
    default: ""
  setup-command:
    description: "Command run inside the app container to migrate and seed the database. Leave empty — the default — when the image's own ENTRYPOINT already does it, which is the case for every image wired up so far. novatalks.core's runtime stage does not even ship npm."
    required: false
    default: ""
  swagger-enable:
    description: "Set SWAGGER_ENABLE=true on the app container; the engine needs it to serve its spec, a connector may have no such var at all"
    required: false
    default: "true"
  needs-nats:
    description: "Bring up a plain, unconfigured NATS server alongside the application"
    required: false
    default: "false"
  target-repository:
    description: "Bare name of the repository whose image is being scanned, e.g. novatalks.core. Defaults to empty, which falls back to the repository this job runs in (GITHUB_REPOSITORY) — correct for the reusable build workflow, which runs in the product repository's own context. ci-dast-pentest.yaml runs in nova.ci and must name the target explicitly, or the postgres major version is chosen for the wrong repository."
    required: false
    default: ""
  extra-env:
    description: "Newline-separated KEY=VALUE lines applied to the application container via -e, for per-repository env the engine's own vars don't cover"
    required: false
    default: ""
  report-file:
    description: "Path the .report is written to"
    required: true
  report-url:
    description: "Public URL the report will be published at, for the notifier line"
    required: false
    default: ""

outputs:
  outcome:
    description: "clean | findings | not-run | error — a failed boot, migration, seed or login is not a clean scan"
    value: ${{ steps.scan.outputs.outcome }}
  findings:
    description: "Number of WARN-level zap-api-scan findings"
    value: ${{ steps.scan.outputs.findings }}
  failures:
    description: "Number of FAIL-level zap-api-scan findings — those the triage register marks as must-fix"
    value: ${{ steps.scan.outputs.failures }}
  message:
    description: "Ready-to-send notifier text"
    value: ${{ steps.scan.outputs.message }}

runs:
  using: composite
  steps:
    # Pinned by digest for the same reason Gitleaks, Semgrep and the baseline DAST scan
    # are — same image and same pin as .github/actions/dast/action.yml, since it is the
    # same ZAP install driven a different way.
    # To upgrade: docker buildx imagetools inspect ghcr.io/zaproxy/zaproxy:stable --format '{{.Manifest.Digest}}'
    - name: Boot, seed, log in, and scan
      id: scan
      shell: bash
      env:
        DAST_IMAGE: ${{ inputs.image }}
        DAST_BOOT_TIMEOUT: ${{ inputs.boot-timeout }}
        DAST_PORT: ${{ inputs.port }}
        DAST_HEALTH_PATH: ${{ inputs.health-path }}
        DAST_SPEC_PATH: ${{ inputs.spec-path }}
        DAST_AUTH_MODE: ${{ inputs.auth-mode }}
        DAST_API_SCAN_MODE: ${{ inputs.scan-mode }}
        DAST_LOGIN_PATH: ${{ inputs.login-path }}
        DAST_AUTH_HEADER: ${{ inputs.auth-header }}
        DAST_AUTH_PREFIX: ${{ inputs.auth-scheme-prefix }}
        DAST_TOKEN_SQL: ${{ inputs.token-sql }}
        DAST_TOKEN_INSERT_SQL: ${{ inputs.token-insert-sql }}
        DAST_TOKEN_ENV_VAR: ${{ inputs.token-env-var }}
        DAST_SETUP_CMD: ${{ inputs.setup-command }}
        DAST_SWAGGER_ENABLE: ${{ inputs.swagger-enable }}
        DAST_NEEDS_NATS: ${{ inputs.needs-nats }}
        DAST_TARGET_REPO: ${{ inputs.target-repository }}
        DAST_EXTRA_ENV: ${{ inputs.extra-env }}
        ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef"
        DAST_REPORT_FILE: ${{ inputs.report-file }}
        REPORT_URL: ${{ inputs.report-url }}
        DAST_ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bash "${DAST_ACTION_ROOT}/scan.sh"
