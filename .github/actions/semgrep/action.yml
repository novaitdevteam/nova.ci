name: "Semgrep SAST scan"
description: "Static security analysis of the checked-out source with Semgrep OSS and the default Semgrep Registry rule packs"

inputs:
  configs:
    description: "Space-separated Semgrep configs"
    required: false
    default: "p/typescript p/nodejs p/owasp-top-ten"
  report-file:
    description: "Path the .report is written to"
    required: true
  report-url:
    description: "Public URL the report will be published at, for the notifier line"
    required: false
    default: ""

outputs:
  outcome:
    description: "clean | findings | error — a notifier must distinguish findings from a broken scanner"
    value: ${{ steps.scan.outputs.outcome }}
  findings:
    description: "Number of high-severity results"
    value: ${{ steps.scan.outputs.findings }}
  warnings:
    description: "Number of medium-severity results (kept for callers; same as medium)"
    value: ${{ steps.scan.outputs.warnings }}
  high:
    description: "High-severity results (ERROR, or a native CRITICAL/HIGH) — the only level that makes outcome=findings"
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: "Medium-severity results (WARNING, or native MEDIUM) — counted and listed on every run"
    value: ${{ steps.scan.outputs.medium }}
  low:
    description: "Low-severity results (INFO, or native LOW) — counted, not listed"
    value: ${{ steps.scan.outputs.low }}
  message:
    description: "Ready-to-send notifier text"
    value: ${{ steps.scan.outputs.message }}

runs:
  using: composite
  steps:
    # Pinned by version AND digest, for the same reason Gitleaks is: a tag can be
    # moved, and `latest` would let an upstream change silently alter what a security
    # gate reports. To upgrade: bump the tag, then re-read the digest with
    #   docker buildx imagetools inspect semgrep/semgrep:<tag>
    # Take the manifest-list digest that prints, not a per-architecture one.
    #
    # The harness stubs `docker`, so it proves the decision logic and nothing about the
    # image. A version bump therefore needs three live checks the harness cannot make,
    # against a fixture that actually produces findings:
    #   1. the JSON shape scan.sh reads is unchanged — .results[].extra.severity,
    #      .results[].check_id, .paths.scanned, .errors[];
    #   2. the same fixture yields the same rule IDs and severities as the old pin, so a
    #      jump in reported counts is a real change in the code, not in the scanner;
    #   3. a deliberately bogus --config still lands a path-less entry in .errors[].
    # The third matters most: it is the only guard that separates "the packs loaded and
    # found nothing" from "the packs never loaded". The canary cannot cover it — it is
    # mounted from this directory and fires either way.
    - name: Scan source
      id: scan
      shell: bash
      env:
        SEMGREP_IMAGE: "semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796"
        SEMGREP_CONFIGS: ${{ inputs.configs }}
        SEMGREP_SRC: ${{ github.workspace }}
        SEMGREP_REPORT_FILE: ${{ inputs.report-file }}
        SEMGREP_ACTION_ROOT: ${{ github.action_path }}
        REPORT_URL: ${{ inputs.report-url }}
      run: |
        set -euo pipefail
        bash "${SEMGREP_ACTION_ROOT}/scan.sh"
