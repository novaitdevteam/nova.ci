name: CI Build NTK Chat Widget on Push TAG
on:
  workflow_call:
    inputs:
      runner_labels:
        required: false
        type: string

jobs:
  build-widget:
    name: Build NovaTalks Widget
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    outputs:
      REP_NAME: ${{ steps.prep.outputs.REP_NAME }}
      SHORT_SHA: ${{ steps.prep.outputs.SHORT_SHA }}
      SHORT_REF_NAME: ${{ steps.prep.outputs.SHORT_REF_NAME }}
      RELEASE: ${{ steps.prep.outputs.RELEASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Vars
        id: prep
        run: |
          echo "REP_NAME=`echo ${GITHUB_REPOSITORY} | cut -d "/" -f2 `" | tee -a $GITHUB_ENV $GITHUB_OUTPUT
          echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" | tee -a $GITHUB_ENV $GITHUB_OUTPUT
          echo "RELEASE=`echo $(date +'%Y_R%q')`" | tee -a $GITHUB_ENV $GITHUB_OUTPUT
          if [[ ${{ github.ref_type }} == 'branch' ]]; then
            short_ref_name="${{ github.ref_name }}"
          else
            short_ref_name="`echo ${{ github.event.base_ref }} | cut -d "/" -f3`"
          fi
          echo "SHORT_REF_NAME=${short_ref_name}" | tee -a $GITHUB_ENV $GITHUB_OUTPUT

      - name: Delete Tag
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          #delete_release: false # default: false
          tag_name: ${{ github.ref_name }} # tag name to delete
          github_token: ${{ secrets.GITHUB_TOKEN }}
          #repo: ${{ github.repository_owner }}/${{ env.REP_NAME }} # target repo (optional). defaults to repo running this action

      - name: 💿 Setup NODEJS
        uses: actions/setup-node@v6
        id: node_inst
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Components & Build
        env:
          UV_THREADPOOL_SIZE: 2
        run: |
          curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | sudo apt-key add -
          echo "deb https://dl.yarnpkg.com/debian/ stable main" | sudo tee /etc/apt/sources.list.d/yarn.list
          sudo apt-get update && sudo apt-get install yarn zip -y
          yarn install
          yarn build
          zip -r ./widget-release-${{ env.SHORT_REF_NAME }}-${{ env.SHORT_SHA }}.zip ./dist

      - name: Create a Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: NTK.CHATWIDGET_${{ env.RELEASE }}_${{ env.SHORT_REF_NAME }}_${{ env.SHORT_SHA }}
          name: NTK.CHATWIDGET_${{ env.RELEASE }}_${{ env.SHORT_REF_NAME }}_${{ env.SHORT_SHA }}
          body: Automated Deployment
          draft: false
          prerelease: false
          files: ./widget-release-${{ env.SHORT_REF_NAME }}-${{ env.SHORT_SHA }}.zip

      - name: End Step On Failure
        if: failure()
        id: end_step
        run: echo "END_STEP_JOB_ID=`echo ${{ github.run_id }}`" | tee -a $GITHUB_OUTPUT

  sast-scan:
    name: SAST Scan
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    # Same gate as the main workflow's sast-scan: every non-pull_request build that
    # succeeded, on any branch. No Trivy and no DAST job in this workflow — it zips
    # `dist` and publishes it as a release asset, it produces no container image, so
    # neither has anything to scan or boot. Semgrep reads source, so it applies exactly
    # as it does everywhere else.
    #
    # This one needs no PUBLISH_RELEASE equivalent: build-widget's "Create a Release"
    # step is itself ungated, so every build this job follows already has a release to
    # attach the report to, feature branches included.
    if: >-
      ${{ always()
      && github.event_name != 'pull_request'
      && needs.build-widget.result == 'success' }}
    needs: [build-widget]
    outputs:
      SCANNED: 'true'
      OUTCOME: ${{ steps.semgrep.outputs.outcome }}
      FINDINGS: ${{ steps.semgrep.outputs.findings }}
      MESSAGE: ${{ steps.semgrep.outputs.message }}
    env:
      REPORT_FILE: semgrep-${{ needs.build-widget.outputs.REP_NAME }}-${{ needs.build-widget.outputs.SHORT_REF_NAME }}-${{ needs.build-widget.outputs.SHORT_SHA }}.report
      RELEASE_TAG: NTK.CHATWIDGET_${{ needs.build-widget.outputs.RELEASE }}_${{ needs.build-widget.outputs.SHORT_REF_NAME }}_${{ needs.build-widget.outputs.SHORT_SHA }}
    steps:
      - name: Checkout
        # Check out the commit SHA, not the trigger ref: a tag-triggered build deletes
        # the tag in build-widget, which has already finished by the time this job runs.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install Docker
        uses: novaitdevteam/nova.ci/.github/actions/install-docker@main

      - name: Semgrep
        id: semgrep
        uses: novaitdevteam/nova.ci/.github/actions/semgrep@main
        with:
          report-file: ${{ env.REPORT_FILE }}
          report-url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.REPORT_FILE }}

      - name: Upload report artifact
        if: ${{ always() && hashFiles(env.REPORT_FILE) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_FILE }}
          path: ${{ env.REPORT_FILE }}

      # Upsert into the release build-widget already created for this build: the same
      # tag_name expression as the "Create a Release" step above, so this appends the
      # report to that release instead of creating a second one.
      - name: Publish report release
        if: ${{ always() && hashFiles(env.REPORT_FILE) != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: false
          files: ${{ env.REPORT_FILE }}

  notify-telegram:
    name: Notifier
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    if: always()
    needs: [build-widget, sast-scan]
    steps:
      - name: Compose SAST line
        id: sast_line
        env:
          RESULT: ${{ needs.sast-scan.result }}
          SCANNED: ${{ needs.sast-scan.outputs.SCANNED }}
          MESSAGE: ${{ needs.sast-scan.outputs.MESSAGE }}
        run: |
          set -euo pipefail

          # A job that died before scan.sh ran leaves MESSAGE empty. Silence there would
          # read as a clean scan, so say so explicitly instead.
          if [[ "$SCANNED" != "true" ]]; then
            line="🔍 SAST (Semgrep): ⏭️ skipped (no build to scan)"
          elif [[ -n "$MESSAGE" ]]; then
            line="$MESSAGE"
          else
            line="🔍 SAST (Semgrep): ❌ scan job failed before reporting (${RESULT})"
          fi

          {
            echo "value<<EOF"
            printf '%s\n' "$line"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set Telegram Message
        uses: novaitdevteam/nova.ci/.github/actions/action-cond@main
        id: telegram_message
        with:
          cond: ${{ contains(join(needs.build-widget.result, ','), 'success') }}
          if_true: |
            👷 ${{ github.actor }} created deploy tag.

            Image building has been completed ✅

            Download Link: https://github.com/novaitdevteam/novatalks.chatwidget/releases/download/NTK.CHATWIDGET_${{ needs.build-widget.outputs.RELEASE }}_${{ needs.build-widget.outputs.SHORT_REF_NAME }}_${{ needs.build-widget.outputs.SHORT_SHA }}/widget-release-${{ needs.build-widget.outputs.SHORT_REF_NAME }}-${{ needs.build-widget.outputs.SHORT_SHA }}.zip

            ${{ steps.sast_line.outputs.value }}

            Repository: ${{ github.repository }}
            See changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}
          if_false: |
            👷 ${{ github.actor }} created deploy tag.

            ❌Build Failed

            🔗 See Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.build-widget.outputs.END_STEP_JOB_ID}}
            Repository: ${{ github.repository }}

      - name: Notify
        uses: novaitdevteam/nova.ci/.github/actions/notify@main
        with:
          message: ${{ steps.telegram_message.outputs.value }}
          telegram_token: ${{ secrets.TG_NOTIFICATION_BOT_TOKEN }}
          telegram_to: ${{ secrets.TG_NOTIFICATION_BOT_ID }}
          gchat_webhook: ${{ secrets.GC_NOTIFICATION_WEBHOOK }}
