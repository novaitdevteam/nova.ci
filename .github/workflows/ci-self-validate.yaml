name: Self Validate

# Meta workflow: validates this repository's own reusable workflows, composite
# actions, and agent docs. Unlike the other workflows here (which are reusable
# via workflow_call), this one runs directly on pushes and pull requests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflows and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Run validation harness
        run: ./scripts/validate.sh

  # nova.ci carries no caller workflow, so it cannot reach the switcher's secret-scan
  # job — it scans itself here, through the same composite action every product repo
  # uses. Being public, this is also the one repository where the check can be made
  # required today (see docs/secret-detection.md on the free-plan limitation).
  #
  # Required-status-check name here: "secret-scan".
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: ./.github/actions/gitleaks
