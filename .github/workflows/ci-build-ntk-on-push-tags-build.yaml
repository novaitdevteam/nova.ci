name: CI Build NTK on Push
on:
  workflow_call:
    inputs:
      runner_labels:
        required: false
        type: string
      build_target:
        required: false
        type: string
        default: ""
      trivy_severity:
        required: false
        type: string
        default: "CRITICAL,HIGH"
      trivy_mode:
        required: false
        type: string
        # warn-only: always succeed, report only.
        # fail-on-critical: fail when CRITICAL found.
        # fail-on-high: fail when CRITICAL or HIGH found.
        default: "warn-only"

jobs:
  linter:
    name: Linter
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    outputs:
      LINTER_CHECK: ${{ steps.linter_res.outputs.LINTER_CHECK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve lint plan
        id: lint_plan
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ inputs.build_target || github.ref_name }}
        run: |
          set -euo pipefail

          set_output() {
            local key="$1"
            shift || true
            {
              echo "${key}<<EOF"
              printf '%s\n' "$@"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          strategy="other"
          set_output bootstrap_command ""
          set_output install_command ""
          set_output lint_command ""
          set_output node_options ""
          set_output node_cache ""
          set_output cache_dependency_path ""

          case "$REPO_NAME" in
            novatalks.core)
              strategy="novatalks.core"
              set_output install_command "npm ci"
              set_output node_options "--max-old-space-size=4096"
              set_output node_cache "npm"
              set_output cache_dependency_path "package-lock.json"
              case "$REF_NAME" in
                build-engine)
                  set_output lint_command "npx eslint apps/engine libs/common libs/database --ext .ts"
                  ;;
                build-reporting)
                  set_output lint_command "npx eslint apps/reporting libs/common libs/database --ext .ts"
                  ;;
                *)
                  set_output lint_command "npm run lint"
                  ;;
              esac
              ;;
            novatalks.ui)
              strategy="novatalks.ui"
              set_output install_command "npm ci"
              set_output node_cache "npm"
              set_output cache_dependency_path "package-lock.json"
              set_output lint_command "npx eslint --ext .js,.vue --ignore-path .eslintignore src"
              ;;
            novatalks.dialer)
              strategy="novatalks.dialer"
              set_output install_command "npm ci"
              set_output node_cache "npm"
              set_output cache_dependency_path "package-lock.json"
              set_output lint_command "npx eslint \"{src,apps,libs,test}/**/*.ts\""
              ;;
            nova.chatsconnector.whatsapp-client-api)
              strategy="nova.chatsconnector.whatsapp-client-api"
              set_output install_command "npm ci"
              set_output node_cache "npm"
              set_output cache_dependency_path "package-lock.json"
              set_output lint_command "npm run lint"
              ;;
            nova.chatsconnector.telegram-client-api)
              strategy="nova.chatsconnector.telegram-client-api"
              set_output install_command "npm ci"
              set_output node_cache "npm"
              set_output cache_dependency_path "package-lock.json"
              set_output lint_command "npm run lint"
              ;;
            nova.chatsconnector.signal-client-api)
              strategy="nova.chatsconnector.signal-client-api"
              set_output install_command "npm ci"
              set_output node_cache "npm"
              set_output cache_dependency_path "package-lock.json"
              set_output lint_command "npm run lint"
              ;;
            nova.botflow)
              strategy="nova.botflow"
              set_output install_command "npm ci"
              set_output node_cache "npm"
              set_output cache_dependency_path "package-lock.json"
              set_output lint_command "npm run lint"
              ;;
            novatalks.uspacy.connector)
              strategy="novatalks.uspacy.connector"
              set_output install_command "npm install"
              set_output lint_command "npm run eslint"
              ;;
            *)
              strategy="other"
              set_output bootstrap_command "npm install -g yarn"
              set_output install_command "yarn add eslint-plugin-security
          yarn add @typescript-eslint/eslint-plugin"
              set_output lint_command "npx eslint --ext .js,.vue,.ts . --quiet"
              ;;
          esac

          set_output strategy "$strategy"
          echo "Selected lint strategy: $strategy"

      - name: 💿 Setup Node.js with npm cache
        if: ${{ steps.lint_plan.outputs.node_cache == 'npm' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.lint_plan.outputs.cache_dependency_path }}

      - name: 💿 Setup Node.js
        if: ${{ steps.lint_plan.outputs.node_cache != 'npm' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare lint toolchain
        if: ${{ steps.lint_plan.outputs.bootstrap_command != '' }}
        run: |
          ${{ steps.lint_plan.outputs.bootstrap_command }}

      - name: Install deps for lint
        if: ${{ steps.lint_plan.outputs.install_command != '' }}
        run: |
          ${{ steps.lint_plan.outputs.install_command }}

      - name: Run lint
        id: linter
        if: ${{ steps.lint_plan.outputs.lint_command != '' }}
        env:
          NODE_OPTIONS: ${{ steps.lint_plan.outputs.node_options }}
        run: |
          ${{ steps.lint_plan.outputs.lint_command }}

      # ======== end ========
      - name: End Linter Step
        if: always()
        id: linter_res
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "LINTER_CHECK=✅" | tee -a "$GITHUB_OUTPUT"
          else
            echo "LINTER_CHECK=❌" | tee -a "$GITHUB_OUTPUT"
          fi

  unit-test:
    name: Unit Tests
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    # Sequential after lint so a run occupies one runner at a time, not two.
    # Advisory: runs even when lint fails, and its own result does not block the build.
    needs: [linter]
    if: ${{ !cancelled() }}
    outputs:
      UNIT_CHECK: ${{ steps.unit_res.outputs.UNIT_CHECK }}
    steps:
      - name: Checkout
        # Check out the commit SHA, not the trigger ref: a tag-triggered build deletes
        # the tag in build-image, which runs in parallel with this gate.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve test plan
        id: test_plan
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          BUILD_TARGET: ${{ inputs.build_target }}
        run: |
          set -euo pipefail

          set_output() {
            local key="$1"
            shift || true
            {
              echo "${key}<<EOF"
              printf '%s\n' "$@"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          set_output install_command ""
          set_output unit_test_command ""
          set_output node_options ""
          set_output node_cache ""
          set_output cache_dependency_path ""

          selected_unit_cmd=""
          case "$REPO_NAME" in
            novatalks.core)
              set_output install_command "npm ci"
              set_output node_options "--max-old-space-size=4096"
              set_output node_cache "npm"
              set_output cache_dependency_path "package-lock.json"
              # Unit tests are not build-target specific. In the core PR matrix (build-engine + build-reporting)
              # run unit only once: skip on the build-reporting leg so it is not executed twice.
              if [[ "$BUILD_TARGET" != "build-reporting" ]]; then
                set_output unit_test_command "npm run test:unit"
                selected_unit_cmd="npm run test:unit"
              fi
              ;;
            *) ;;  # other repos: no unit gate (no-op success)
          esac

          echo "Selected unit test command: ${selected_unit_cmd:-(none)}"

      - name: 💿 Setup Node.js with npm cache
        if: ${{ steps.test_plan.outputs.node_cache == 'npm' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.test_plan.outputs.cache_dependency_path }}

      - name: 💿 Setup Node.js
        if: ${{ steps.test_plan.outputs.node_cache != 'npm' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install deps for unit tests
        if: ${{ steps.test_plan.outputs.unit_test_command != '' && steps.test_plan.outputs.install_command != '' }}
        run: |
          ${{ steps.test_plan.outputs.install_command }}

      - name: Run unit tests
        id: unit
        if: ${{ steps.test_plan.outputs.unit_test_command != '' }}
        env:
          NODE_OPTIONS: ${{ steps.test_plan.outputs.node_options }}
        run: |
          set -o pipefail
          ${{ steps.test_plan.outputs.unit_test_command }} 2>&1 | tee results.txt

      # Surface pass/fail counts in the Actions/Checks UI (incl. on PRs, where there is
      # no notifier). Runs even on failure so the counts of failed tests are visible.
      - name: 📊 Summarize unit results
        if: ${{ always() && steps.test_plan.outputs.unit_test_command != '' }}
        run: |
          tests="n/a"; suites="n/a"
          if [ -f results.txt ]; then
            t=$(grep -E '^Tests:' results.txt | tail -1 | sed -E 's/^Tests:[[:space:]]*//'); [ -n "$t" ] && tests="$t"
            s=$(grep -E '^Test Suites:' results.txt | tail -1 | sed -E 's/^Test Suites:[[:space:]]*//'); [ -n "$s" ] && suites="$s"
          fi
          {
            echo "### Unit tests"
            echo "- **Tests:** ${tests}"
            echo "- **Suites:** ${suites}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ======== end ========
      - name: End Unit Step
        if: always()
        id: unit_res
        env:
          UNIT_TEST_COMMAND: ${{ steps.test_plan.outputs.unit_test_command }}
        run: |
          if [[ "${{ job.status }}" != "success" ]]; then
            echo "UNIT_CHECK=❌" | tee -a "$GITHUB_OUTPUT"
          elif [[ -z "$UNIT_TEST_COMMAND" ]]; then
            # No unit test plan for this repo/target: the gate is a no-op success.
            # Report it as "not configured" so the notifier does not claim tests passed.
            echo "UNIT_CHECK=⏭️ n/a (no unit tests configured)" | tee -a "$GITHUB_OUTPUT"
          else
            echo "UNIT_CHECK=✅" | tee -a "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build Image
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    # permissions:
    #   contents: read
    #   packages: write
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [linter, unit-test]
    outputs:
      REP_NAME: ${{ steps.prep.outputs.REP_NAME }}
      SHORT_SHA: ${{ steps.prep.outputs.SHORT_SHA }}
      SHORT_REF_NAME: ${{ steps.prep.outputs.SHORT_REF_NAME }}
      RELEASE: ${{ steps.prep.outputs.RELEASE }}
      END_STEP_JOB_ID: ${{ steps.end_step.outputs.END_STEP_JOB_ID }}
      IMAGE_SUFFIX: ${{ steps.set_dockerfile.outputs.IMAGE_SUFFIX }}
      IS_TRUNK: ${{ steps.prep.outputs.IS_TRUNK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Docker
        uses: novaitdevteam/nova.ci/.github/actions/install-docker@main
          
      - name: Prepare Vars
        id: prep
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.event.base_ref }}
        run: |
          rep_name="$(echo "${GITHUB_REPOSITORY}" | cut -d "/" -f2)"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-8)"
          release="$(date +'%Y_R%q')"

          if [[ -n "$HEAD_REF" ]]; then
            short_ref_name="$HEAD_REF"
          elif [[ "$REF_TYPE" == "branch" ]]; then
            short_ref_name="$REF_NAME"
          else
            short_ref_name="${BASE_REF#refs/heads/}"
          fi

          short_ref_name="$(printf '%s' "$short_ref_name" | sed 's#[^A-Za-z0-9_.-]#-#g')"

          # Trunk drives every scan gate. Resolved once here, where SHORT_REF_NAME is
          # already known, because a job-level `if` cannot reach into another job's step.
          case "$short_ref_name" in
            main|master|development) is_trunk=true ;;
            *)                       is_trunk=false ;;
          esac

          echo "REP_NAME=${rep_name}" | tee -a $GITHUB_ENV $GITHUB_OUTPUT
          echo "SHORT_SHA=${short_sha}" | tee -a $GITHUB_ENV $GITHUB_OUTPUT
          echo "RELEASE=${release}" | tee -a $GITHUB_ENV $GITHUB_OUTPUT
          echo "SHORT_REF_NAME=${short_ref_name}" | tee -a $GITHUB_ENV $GITHUB_OUTPUT
          echo "IS_TRUNK=${is_trunk}" | tee -a $GITHUB_ENV $GITHUB_OUTPUT

      - name: Delete Tag
        if: ${{ github.ref_type == 'tag' && inputs.build_target == '' }}
        uses: actions/github-script@v8
        env:
          TAG_NAME: ${{ github.ref_name }} # tag name to delete
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_NAME;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Deleted tag ${tag}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.warning(`Tag ${tag} not found, skipping deletion.`);
              } else {
                throw error;
              }
            }

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          #username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.CR_DH_USERNAME }}
          password: ${{ secrets.CR_DH_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug
          driver-opts: network=host
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
            [grpc]
              max-recv-msg-size = 104857600
              max-send-msg-size = 104857600

      - name: Set Dockerfile path and image suffix
        id: set_dockerfile
        env:
          BUILD_TARGET: ${{ inputs.build_target || github.ref_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # A scan* or apiscan* tag names a trigger, not a build target, so it falls
          # through to the else branch and server.Dockerfile — which novatalks.core does
          # not have: it ships engine, reporting, restore-historical and
          # message-source-id instead, so a scan tag there failed the build outright.
          # The engine is the representative image for that repository — the other
          # components build from the same shared libraries, so scanning it covers them,
          # and the api-scan job needs the engine image specifically. Every other
          # repository has a single server.Dockerfile and is untouched by this, as is any
          # explicit build target.
          if [[ "$REPO_NAME" == "novatalks.core" && ( "$BUILD_TARGET" == scan* || "$BUILD_TARGET" == apiscan* ) ]]; then
            echo "scan/apiscan tag on novatalks.core: building the engine as the representative image"
            BUILD_TARGET="build-engine"
          fi

          if [[ "$BUILD_TARGET" == "build-engine" ]]; then
            echo "DOCKERFILE_PATH=./docker/engine.Dockerfile" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=_engine" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=_engine" >> $GITHUB_OUTPUT
          elif [[ "$BUILD_TARGET" == "build-reporting" ]]; then
            echo "DOCKERFILE_PATH=./docker/reporting.Dockerfile" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=_reporting" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=_reporting" >> $GITHUB_OUTPUT
          elif [[ "$BUILD_TARGET" == "build-restore-historical" ]]; then
            echo "DOCKERFILE_PATH=./docker/restore-historical.Dockerfile" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=_restore-historical" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=_restore-historical" >> $GITHUB_OUTPUT
          elif [[ "$BUILD_TARGET" == "build-message-source-id" ]]; then
            echo "DOCKERFILE_PATH=./docker/message-source-id.Dockerfile" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=_migrate-message-source-id" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=_migrate-message-source-id" >> $GITHUB_OUTPUT
          else
            echo "DOCKERFILE_PATH=./docker/server.Dockerfile" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=" >> $GITHUB_ENV
            echo "IMAGE_SUFFIX=" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Docker cache policy
        id: cache_policy
        env:
          REPO_NAME: ${{ env.REP_NAME }}
          IMAGE_SUFFIX: ${{ env.IMAGE_SUFFIX }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.event.base_ref }}
        run: |
          set -euo pipefail

          set_output() {
            local key="$1"
            shift || true
            {
              echo "${key}<<EOF"
              printf '%s\n' "$@"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          cache_ref="type=registry,ref=ghcr.io/${{ github.repository_owner }}/${REPO_NAME}:buildcache${IMAGE_SUFFIX}"
          source_branch="$REF_NAME"

          if [[ "$REF_TYPE" != "branch" && -n "$BASE_REF" ]]; then
            source_branch="${BASE_REF#refs/heads/}"
          fi

          cache_to="${cache_ref},mode=max"
          case "$source_branch" in
            master|development|main)
              ;;
            *)
              cache_to=""
              ;;
          esac

          set_output source_branch "$source_branch"
          set_output cache_from "$cache_ref"
          set_output cache_to "$cache_to"

          echo "Selected cache source branch: $source_branch"
          if [[ -n "$cache_to" ]]; then
            echo "Cache export enabled."
          else
            echo "Cache export disabled for this build."
          fi

      - name: Build and push
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
          CACHE_TO: ${{ steps.cache_policy.outputs.cache_to }}
          CACHE_FROM: ${{ steps.cache_policy.outputs.cache_from }}
          TAG_DH: ${{ secrets.CR_DH_USERNAME }}/${{ env.REP_NAME }}:${{ env.RELEASE }}_${{ env.SHORT_REF_NAME }}${{ env.IMAGE_SUFFIX }}_${{ env.SHORT_SHA }}
          TAG_GHCR: ghcr.io/${{ github.repository_owner }}/${{ env.REP_NAME }}:${{ env.RELEASE }}_${{ env.SHORT_REF_NAME }}${{ env.IMAGE_SUFFIX }}_${{ env.SHORT_SHA }}
        run: |
          set -euo pipefail

          build_args=(
            --builder "${{ steps.buildx.outputs.name }}"
            --file "${{ env.DOCKERFILE_PATH }}"
            --target main
            --pull
            --push
            --cache-from "$CACHE_FROM"
            --tag "$TAG_DH"
            --tag "$TAG_GHCR"
            .
          )

          if [[ -n "$CACHE_TO" ]]; then
            build_args+=(--cache-to "$CACHE_TO")
          fi

          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            docker buildx build "${build_args[@]}" && break
            echo "Attempt $attempt failed."
            [ "$attempt" -lt 3 ] && sleep 20
          done

      - name: Add latest tag on master DOCKER
        if: ${{ contains( github.event.base_ref, 'master' ) }}
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx imagetools create \
            --tag ${{ secrets.CR_DH_USERNAME }}/${{ env.REP_NAME }}:latest \
            ${{ secrets.CR_DH_USERNAME }}/${{ env.REP_NAME }}:${{ env.RELEASE }}_${{ env.SHORT_REF_NAME }}${{ env.IMAGE_SUFFIX }}_${{ env.SHORT_SHA }}

      - name: Add latest tag on master GHCR
        if: ${{ contains( github.event.base_ref, 'master' ) }}
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/${{ env.REP_NAME }}:latest \
            ghcr.io/${{ github.repository_owner }}/${{ env.REP_NAME }}:${{ env.RELEASE }}_${{ env.SHORT_REF_NAME }}${{ env.IMAGE_SUFFIX }}_${{ env.SHORT_SHA }}

      - name: End Step On Failure
        if: failure()
        id: end_step
        run: echo "END_STEP_JOB_ID=`echo ${{ github.run_id }}`" | tee -a $GITHUB_OUTPUT

  trivy-scan:
    name: Trivy Scan
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    # Lint-only for PRs: never scan on pull_request. Only scan a successfully built image.
    if: ${{ always() && github.event_name != 'pull_request' && needs.build-image.result == 'success' }}
    needs: [build-image]
    outputs:
      SCANNED: ${{ steps.scan_policy.outputs.should_scan }}
      MODE: ${{ steps.scan_policy.outputs.mode }}
      CRITICAL: ${{ steps.report.outputs.critical }}
      HIGH: ${{ steps.report.outputs.high }}
      REPORT_URL: ${{ steps.report.outputs.report_url }}
    env:
      TRIVY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ needs.build-image.outputs.REP_NAME }}:${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
      REPORT_FILE: trivy-${{ needs.build-image.outputs.REP_NAME }}-${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}-${{ needs.build-image.outputs.SHORT_SHA }}.report
      RELEASE_TAG: TRIVY.SCAN_${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}
    steps:
      - name: Resolve scan policy
        id: scan_policy
        env:
          SOURCE_BRANCH: ${{ needs.build-image.outputs.SHORT_REF_NAME }}
          REF_NAME: ${{ github.ref_name }}
          SCAN_SEVERITY: ${{ inputs.trivy_severity }}
          SCAN_MODE: ${{ inputs.trivy_mode }}
        run: |
          set -euo pipefail

          severity="${SCAN_SEVERITY:-CRITICAL,HIGH}"
          mode="${SCAN_MODE:-warn-only}"

          # Auto-scan protected source branches; otherwise require a strict scan tag
          # (the ref name must start with "scan", e.g. "scan" or "scan-NC2-1234").
          should_scan="false"
          reason=""
          case "$SOURCE_BRANCH" in
            main|master|development)
              should_scan="true"
              reason="protected source branch ($SOURCE_BRANCH)"
              ;;
          esac

          if [[ "$should_scan" != "true" && "$REF_NAME" == scan* ]]; then
            should_scan="true"
            reason="explicit scan tag ($REF_NAME)"
          fi

          # Bucket the Trivy DB cache into 5-hour windows so a stale DB lives at most ~5h.
          cache_bucket="$(( $(date +%s) / 18000 ))"

          echo "should_scan=$should_scan" | tee -a "$GITHUB_OUTPUT"
          echo "severity=$severity" | tee -a "$GITHUB_OUTPUT"
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"
          echo "cache_bucket=$cache_bucket" | tee -a "$GITHUB_OUTPUT"

          if [[ "$should_scan" == "true" ]]; then
            echo "Trivy scan enabled: $reason"
          else
            echo "Trivy scan skipped: source branch '$SOURCE_BRANCH' is not main/master/development and the trigger ref '$REF_NAME' does not start with 'scan'."
          fi

      - name: Install Docker
        if: ${{ steps.scan_policy.outputs.should_scan == 'true' }}
        uses: novaitdevteam/nova.ci/.github/actions/install-docker@main

      - name: Login to GitHub Container Registry
        if: ${{ steps.scan_policy.outputs.should_scan == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        if: ${{ steps.scan_policy.outputs.should_scan == 'true' }}
        run: docker pull --platform linux/amd64 "$TRIVY_IMAGE"

      # 5-hour cache window: a new key every 5h forces a fresh Trivy DB at least that often.
      - name: Cache Trivy databases (5h window)
        if: ${{ steps.scan_policy.outputs.should_scan == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-5h-${{ steps.scan_policy.outputs.cache_bucket }}
          restore-keys: |
            trivy-db-5h-

      # OS-package vulnerabilities. First call also installs Trivy and downloads the
      # vulnerability + Java DBs (the action manages both, so no manual two-step download).
      - name: Trivy scan (OS packages)
        if: ${{ steps.scan_policy.outputs.should_scan == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PKG_TYPES: os
        with:
          scan-type: image
          image-ref: ${{ env.TRIVY_IMAGE }}
          format: table
          output: trivy-os.txt
          severity: ${{ steps.scan_policy.outputs.severity }}
          scanners: vuln
          cache: "false"
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          hide-progress: "true"

      # Application/library vulnerabilities (Node.js node-pkg, etc).
      - name: Trivy scan (libraries)
        if: ${{ steps.scan_policy.outputs.should_scan == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PKG_TYPES: library
        with:
          scan-type: image
          image-ref: ${{ env.TRIVY_IMAGE }}
          format: table
          output: trivy-library.txt
          severity: ${{ steps.scan_policy.outputs.severity }}
          scanners: vuln
          cache: "false"
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          hide-progress: "true"
          skip-setup-trivy: "true"

      # Machine-readable pass used only to count findings for the summary and fail policy.
      - name: Trivy scan (JSON for counts)
        if: ${{ steps.scan_policy.outputs.should_scan == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.TRIVY_IMAGE }}
          format: json
          output: trivy-counts.json
          severity: ${{ steps.scan_policy.outputs.severity }}
          scanners: vuln
          cache: "false"
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          hide-progress: "true"
          skip-setup-trivy: "true"

      - name: Assemble report
        id: report
        if: ${{ steps.scan_policy.outputs.should_scan == 'true' }}
        run: |
          set -euo pipefail

          {
            echo "=============================="
            echo " IMAGE: $TRIVY_IMAGE"
            echo "=============================="
            echo ""
            echo "=== OS Vulnerabilities ==="
            cat trivy-os.txt
            echo ""
            echo "=== Node.js Vulnerabilities ==="
            sed -n '/^Node.js (node-pkg)/,$p' trivy-library.txt
          } > "$REPORT_FILE"

          # grep exits non-zero when there are no matches (clean image); under pipefail that
          # would kill the step, so swallow grep's status before counting -> 0 findings = "0".
          crit=$({ grep -o '"Severity":[[:space:]]*"CRITICAL"' trivy-counts.json || true; } | wc -l | tr -d ' ')
          high=$({ grep -o '"Severity":[[:space:]]*"HIGH"' trivy-counts.json || true; } | wc -l | tr -d ' ')
          echo "critical=$crit" | tee -a "$GITHUB_OUTPUT"
          echo "high=$high" | tee -a "$GITHUB_OUTPUT"
          echo "report_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${REPORT_FILE}" | tee -a "$GITHUB_OUTPUT"

          echo "Report written to $REPORT_FILE"

      - name: Upload report artifact
        if: ${{ always() && steps.scan_policy.outputs.should_scan == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_FILE }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: warn

      # Publish the .report as a downloadable release asset, like the chat widget build.
      - name: Publish report release
        if: ${{ always() && steps.scan_policy.outputs.should_scan == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: Automated Trivy scan report for ${{ env.TRIVY_IMAGE }}
          draft: false
          prerelease: true
          files: ${{ env.REPORT_FILE }}

      - name: Publish scan summary and apply policy
        if: ${{ always() && steps.scan_policy.outputs.should_scan == 'true' }}
        env:
          CRIT: ${{ steps.report.outputs.critical }}
          HIGH: ${{ steps.report.outputs.high }}
          MODE: ${{ steps.scan_policy.outputs.mode }}
          SEVERITY: ${{ steps.scan_policy.outputs.severity }}
          DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.REPORT_FILE }}
        run: |
          set -euo pipefail

          crit="${CRIT:-0}"
          high="${HIGH:-0}"

          # Pick a colored GitHub-flavored alert banner by worst severity found.
          if [[ "$crit" -gt 0 ]]; then
            alert="CAUTION"
            headline="🚨 $crit CRITICAL and $high HIGH vulnerabilities found — review the report."
          elif [[ "$high" -gt 0 ]]; then
            alert="WARNING"
            headline="⚠️ $high HIGH vulnerabilities found — review the report."
          else
            alert="NOTE"
            headline="✅ No CRITICAL or HIGH vulnerabilities found."
          fi

          {
            echo "## 🔐 Trivy image scan"
            echo ""
            echo "> [!${alert}]"
            echo "> ${headline}"
            echo ""
            echo "- Image: \`$TRIVY_IMAGE\`"
            echo "- Severities scanned: \`$SEVERITY\`"
            echo "- Policy mode: \`$MODE\`"
            echo "- Report: [\`$REPORT_FILE\`]($DOWNLOAD_URL)"
            echo ""
            echo "| Severity | Count |"
            echo "| --- | --- |"
            echo "| CRITICAL | $crit |"
            echo "| HIGH | $high |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Trivy results — CRITICAL: $crit, HIGH: $high (mode: $MODE)"

          case "$MODE" in
            fail-on-critical)
              if [[ "$crit" -gt 0 ]]; then
                echo "::error::Trivy found $crit CRITICAL vulnerabilities; failing per '$MODE' policy."
                exit 1
              fi
              ;;
            fail-on-high)
              if [[ "$crit" -gt 0 || "$high" -gt 0 ]]; then
                echo "::error::Trivy found $crit CRITICAL and $high HIGH vulnerabilities; failing per '$MODE' policy."
                exit 1
              fi
              ;;
          esac

          if [[ "$crit" -gt 0 || "$high" -gt 0 ]]; then
            echo "::warning::Trivy found $crit CRITICAL and $high HIGH vulnerabilities. See $REPORT_FILE."
          fi

  sast-scan:
    name: SAST Scan
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    # Every build that produced an image, on any branch. Semgrep reads the source that
    # was just built — no running application, no database, no seeded stack — so nothing
    # about a feature branch makes its result less true, and a finding is cheapest to fix
    # before the branch merges. The trunk/`scan*` narrowing that trivy-scan and dast-scan
    # keep is only about having a release to attach a report to; that concern moved to
    # PUBLISH_RELEASE below, where it actually belongs. `pull_request` stays excluded —
    # build-image does not run there, so there is no build to scan. Sequential after
    # trivy-scan: three parallel scan jobs would only queue against the per-size cap of 2.
    if: >-
      ${{ always()
      && github.event_name != 'pull_request'
      && needs.build-image.result == 'success' }}
    needs: [build-image, trivy-scan]
    outputs:
      SCANNED: 'true'
      OUTCOME: ${{ steps.semgrep.outputs.outcome }}
      FINDINGS: ${{ steps.semgrep.outputs.findings }}
      MESSAGE: ${{ steps.semgrep.outputs.message }}
    env:
      REPORT_FILE: semgrep-${{ needs.build-image.outputs.REP_NAME }}-${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}-${{ needs.build-image.outputs.SHORT_SHA }}.report
      RELEASE_TAG: TRIVY.SCAN_${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}
      # The TRIVY.SCAN_ release exists only because trivy-scan created it, and trivy-scan
      # still runs on trunk and `scan*` builds only. On any other branch there is no
      # release to upsert into, and letting action-gh-release create one would mint a
      # TRIVY.SCAN_ git tag per feature build — noise in the tag list the quarterly
      # evidence walk has to step over. There the artifact is the copy of the report.
      PUBLISH_RELEASE: ${{ needs.build-image.outputs.IS_TRUNK == 'true' || startsWith(github.ref_name, 'scan') }}
    steps:
      - name: Checkout
        # Check out the commit SHA, not the trigger ref: a tag-triggered build deletes
        # the tag in build-image, which has already finished by the time this job runs.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install Docker
        uses: novaitdevteam/nova.ci/.github/actions/install-docker@main

      - name: Semgrep
        id: semgrep
        uses: novaitdevteam/nova.ci/.github/actions/semgrep@main
        with:
          report-file: ${{ env.REPORT_FILE }}
          # Where the notifier line points. On a published build that is the release
          # asset; on a feature build the report only exists as this run's artifact, so
          # link the run rather than a release-download URL that would 404.
          report-url: ${{ env.PUBLISH_RELEASE == 'true' && format('{0}/{1}/releases/download/{2}/{3}', github.server_url, github.repository, env.RELEASE_TAG, env.REPORT_FILE) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}

      - name: Upload report artifact
        if: ${{ always() && hashFiles(env.REPORT_FILE) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_FILE }}
          path: ${{ env.REPORT_FILE }}

      # Upsert into the release trivy-scan already created for this build: one release
      # per build carrying every scanner's report. The TRIVY.SCAN_ prefix is historical
      # — see docs/container-scanning.md. Only where that release exists; see
      # PUBLISH_RELEASE above.
      - name: Publish report release
        if: ${{ always() && env.PUBLISH_RELEASE == 'true' && hashFiles(env.REPORT_FILE) != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: true
          files: ${{ env.REPORT_FILE }}

  dast-scan:
    name: DAST Scan
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    # Same gate as SAST, narrowed to the repositories whose images are known to boot
    # in CI. Everything else reaches DAST only by explicit request.
    if: >-
      ${{ always()
      && github.event_name != 'pull_request'
      && needs.build-image.result == 'success'
      && (needs.build-image.outputs.IS_TRUNK == 'true' || startsWith(github.ref_name, 'scan'))
      && contains(fromJSON('["novatalks.ui","novatalks.core","nova.botflow"]'), github.event.repository.name) }}
    needs: [build-image, sast-scan]
    outputs:
      SCANNED: 'true'
      OUTCOME: ${{ steps.dast.outputs.outcome }}
      FINDINGS: ${{ steps.dast.outputs.findings }}
      MESSAGE: ${{ steps.dast.outputs.message }}
    env:
      DAST_TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ needs.build-image.outputs.REP_NAME }}:${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}
      REPORT_FILE: zap-${{ needs.build-image.outputs.REP_NAME }}-${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}-${{ needs.build-image.outputs.SHORT_SHA }}.report
      RELEASE_TAG: TRIVY.SCAN_${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}
    steps:
      - name: Checkout
        # Check out the commit SHA, not the trigger ref: a tag-triggered build deletes
        # the tag in build-image, which has already finished by the time this job runs.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve DAST target
        id: dast_target
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          case "$REPO_NAME" in
            novatalks.ui)
              # nginx serving the static Vue app. Port and health path from the
              # production Helm chart (novatalks.charts, novatalks_v5/values.yaml) —
              # authoritative because it is what runs in prod.
              port=8000
              health_path=/livez
              needs_db=false
              needs_nats=false
              extra_env=""
              ;;
            novatalks.core)
              # NestJS engine. Same chart source as above.
              port=3000
              health_path=/livez
              needs_db=true
              needs_nats=false
              extra_env=""
              ;;
            nova.botflow)
              # No dedicated HTTP health route — the chart probes over tcpSocket. "/" is
              # correct here: the boot wait-loop accepts any HTTP response, 404 included,
              # because it is only testing whether the process is listening, not whether
              # a route exists. Do not "fix" this to /livez.
              port=1880
              health_path=/
              # Needs redis or postgres depending on its storage configuration; bringing
              # up both is simpler than modelling the choice, and an unused container
              # costs a few seconds.
              needs_db=true
              needs_nats=false
              extra_env=""
              ;;
            # Only the three browser-surface repositories reach dast-scan (see the job
            # gate above). The ZAP baseline is a browser tool — on a headless JSON API it
            # finds three response headers and nothing a browser would; the connectors
            # (telegram/whatsapp/signal/dialer) and geoip/uspacy were removed on 2026-09-01.
            # Their real coverage is the authenticated api-scan (see the api-scan job), a
            # tracked per-repo expansion; a generalised api-scan will need their ports/health
            # paths, recorded in the tracking note, not here.
            *)
              echo "::error::No DAST configuration for repository '$REPO_NAME'. Add an explicit port/health-path/needs-db entry before this repository can reach dast-scan — a guessed port would scan nothing and report it clean."
              exit 1
              ;;
          esac

          echo "port=$port" | tee -a "$GITHUB_OUTPUT"
          echo "health_path=$health_path" | tee -a "$GITHUB_OUTPUT"
          echo "needs_db=$needs_db" | tee -a "$GITHUB_OUTPUT"
          echo "needs_nats=$needs_nats" | tee -a "$GITHUB_OUTPUT"
          {
            echo "extra_env<<DAST_EXTRA_ENV_EOF"
            printf '%s\n' "$extra_env"
            echo "DAST_EXTRA_ENV_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved DAST target for $REPO_NAME: port=$port health-path=$health_path needs-db=$needs_db needs-nats=$needs_nats extra-env=$([ -n "$extra_env" ] && echo set || echo none)"

      - name: Install Docker
        uses: novaitdevteam/nova.ci/.github/actions/install-docker@main

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull --platform linux/amd64 "$DAST_TARGET_IMAGE"

      - name: ZAP baseline
        id: dast
        uses: novaitdevteam/nova.ci/.github/actions/dast@main
        with:
          image: ${{ env.DAST_TARGET_IMAGE }}
          port: ${{ steps.dast_target.outputs.port }}
          health-path: ${{ steps.dast_target.outputs.health_path }}
          # Derived from the engine chart's startupProbe: initialDelaySeconds 5 +
          # failureThreshold 15 * periodSeconds 30 ≈ 455s before k8s gives up on startup.
          # 300 sits between that and the action's 180 default, which risks a false
          # "not run" on a cold start.
          boot-timeout: 300
          needs-db: ${{ steps.dast_target.outputs.needs_db }}
          needs-nats: ${{ steps.dast_target.outputs.needs_nats }}
          extra-env: ${{ steps.dast_target.outputs.extra_env }}
          report-file: ${{ env.REPORT_FILE }}
          report-url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.REPORT_FILE }}

      - name: Upload report artifact
        if: ${{ always() && hashFiles(env.REPORT_FILE) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_FILE }}
          path: ${{ env.REPORT_FILE }}

      - name: Publish report release
        if: ${{ always() && hashFiles(env.REPORT_FILE) != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: true
          files: ${{ env.REPORT_FILE }}

  api-scan:
    name: API Scan
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    # Opt-in only: an apiscan* tag on novatalks.core or the telegram connector. The
    # authenticated scan is a 341-operation run against a seeded stack, not something
    # every build should pay for.
    if: >-
      ${{ always()
      && github.event_name != 'pull_request'
      && needs.build-image.result == 'success'
      && contains(fromJSON('["novatalks.core","nova.chatsconnector.telegram-client-api"]'), github.event.repository.name)
      && startsWith(github.ref_name, 'apiscan') }}
    needs: [build-image]
    outputs:
      SCANNED: 'true'
      OUTCOME: ${{ steps.dast_api.outputs.outcome }}
      FINDINGS: ${{ steps.dast_api.outputs.findings }}
      FAILURES: ${{ steps.dast_api.outputs.failures }}
      MESSAGE: ${{ steps.dast_api.outputs.message }}
    env:
      DAST_TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ needs.build-image.outputs.REP_NAME }}:${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}
      REPORT_FILE: zap-api-${{ needs.build-image.outputs.REP_NAME }}-${{ needs.build-image.outputs.SHORT_REF_NAME }}-${{ needs.build-image.outputs.SHORT_SHA }}.report
      RELEASE_TAG: TRIVY.SCAN_${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}
    steps:
      - name: Checkout
        # Check out the commit SHA, not the trigger ref: a tag-triggered build deletes
        # the tag in build-image, which has already finished by the time this job runs.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install Docker
        uses: novaitdevteam/nova.ci/.github/actions/install-docker@main

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull --platform linux/amd64 "$DAST_TARGET_IMAGE"

      - name: Resolve api-scan target
        id: apiscan_target
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          case "$REPO_NAME" in
            novatalks.core)
              port=3000; health_path=/livez; spec_path=/api-docs-json
              auth_mode=login; login_path=/auth/sign_in
              auth_header=Authorization; auth_scheme_prefix='Bearer '
              token_sql=''; setup_command='npm run db:setup:prod'; swagger_enable=true
              extra_env=''
              ;;
            nova.chatsconnector.telegram-client-api)
              # Verified in the connector's code: api_access_token header (setup-swagger.ts),
              # DB-backed token in tokens.api_token joined to token_roles.role (schema.prisma),
              # seeded by `npm run db:seed`, Swagger served unconditionally, no health route so "/".
              port=3000; health_path=/; spec_path=/api-docs-json
              auth_mode=db-token; login_path=''
              auth_header=api_access_token; auth_scheme_prefix=''
              token_sql="SELECT t.api_token FROM tokens t JOIN token_roles r ON t.role_id = r.id WHERE r.role = 'SUPER_ADMIN' ORDER BY t.id LIMIT 1;"
              setup_command='npm run db:setup'; swagger_enable=false  # db:setup = migrate + prisma db seed (the repo's canonical combined script)
              # Boot dummies the connector's config validator rejects a blank for — the same
              # values the removed baseline arm used; DATABASE_URL for Prisma is built by scan.sh.
              extra_env='TELEGRAM_API_ID=12345
          TELEGRAM_API_HASH=00000000000000000000000000000000
          NOVATALKS_ACCESS_TOKEN=dast-dummy-dummy-token
          ENCRYPTION_SECRET=dast-dummy-dummy-dummy-dummy-dummy'
              ;;
            *)
              echo "::error::No api-scan configuration for '$REPO_NAME'."
              exit 1
              ;;
          esac

          echo "port=$port" | tee -a "$GITHUB_OUTPUT"
          echo "health_path=$health_path" | tee -a "$GITHUB_OUTPUT"
          echo "spec_path=$spec_path" | tee -a "$GITHUB_OUTPUT"
          echo "auth_mode=$auth_mode" | tee -a "$GITHUB_OUTPUT"
          echo "login_path=$login_path" | tee -a "$GITHUB_OUTPUT"
          echo "auth_header=$auth_header" | tee -a "$GITHUB_OUTPUT"
          {
            echo "auth_scheme_prefix<<APISCAN_AUTH_PREFIX_EOF"
            printf '%s\n' "$auth_scheme_prefix"
            echo "APISCAN_AUTH_PREFIX_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "token_sql<<APISCAN_TOKEN_SQL_EOF"
            printf '%s\n' "$token_sql"
            echo "APISCAN_TOKEN_SQL_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "setup_command=$setup_command" | tee -a "$GITHUB_OUTPUT"
          echo "swagger_enable=$swagger_enable" | tee -a "$GITHUB_OUTPUT"
          {
            echo "extra_env<<APISCAN_EXTRA_ENV_EOF"
            printf '%s\n' "$extra_env"
            echo "APISCAN_EXTRA_ENV_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved api-scan target for $REPO_NAME: port=$port health-path=$health_path auth-mode=$auth_mode swagger-enable=$swagger_enable"

      - name: ZAP API scan
        id: dast_api
        uses: novaitdevteam/nova.ci/.github/actions/dast-api@main
        with:
          image: ${{ env.DAST_TARGET_IMAGE }}
          port: ${{ steps.apiscan_target.outputs.port }}
          health-path: ${{ steps.apiscan_target.outputs.health_path }}
          spec-path: ${{ steps.apiscan_target.outputs.spec_path }}
          auth-mode: ${{ steps.apiscan_target.outputs.auth_mode }}
          login-path: ${{ steps.apiscan_target.outputs.login_path }}
          auth-header: ${{ steps.apiscan_target.outputs.auth_header }}
          auth-scheme-prefix: ${{ steps.apiscan_target.outputs.auth_scheme_prefix }}
          token-sql: ${{ steps.apiscan_target.outputs.token_sql }}
          setup-command: ${{ steps.apiscan_target.outputs.setup_command }}
          swagger-enable: ${{ steps.apiscan_target.outputs.swagger_enable }}
          extra-env: ${{ steps.apiscan_target.outputs.extra_env }}
          report-file: ${{ env.REPORT_FILE }}
          report-url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.REPORT_FILE }}

      - name: Upload report artifact
        if: ${{ always() && hashFiles(env.REPORT_FILE) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_FILE }}
          path: ${{ env.REPORT_FILE }}

      - name: Publish report release
        if: ${{ always() && hashFiles(env.REPORT_FILE) != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: true
          files: ${{ env.REPORT_FILE }}

  notify-telegram:
    name: Notifier
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [build-image, linter, trivy-scan, unit-test, sast-scan, dast-scan, api-scan]
    steps:
      - name: Compose Trivy line
        id: trivy_line
        env:
          RESULT: ${{ needs.trivy-scan.result }}
          SCANNED: ${{ needs.trivy-scan.outputs.SCANNED }}
          MODE: ${{ needs.trivy-scan.outputs.MODE }}
          CRIT: ${{ needs.trivy-scan.outputs.CRITICAL }}
          HIGH: ${{ needs.trivy-scan.outputs.HIGH }}
          URL: ${{ needs.trivy-scan.outputs.REPORT_URL }}
        run: |
          set -euo pipefail

          if [[ "$SCANNED" == "true" ]]; then
            crit="${CRIT:-0}"
            high="${HIGH:-0}"
            # Style by worst severity. Build stays green (warn-only); this only signals.
            if [[ "$RESULT" == "failure" ]]; then
              head="🔐 Trivy Scan: ❌ FAILED  (policy: ${MODE})"
            elif [[ "$crit" -gt 0 ]]; then
              head="🔐 Trivy Scan: 🔴 CRITICAL found!"
            elif [[ "$high" -gt 0 ]]; then
              head="🔐 Trivy Scan: 🟠 HIGH found"
            else
              head="🔐 Trivy Scan: 🟢 clean"
            fi
            line="${head}"
            line="${line}"$'\n'"   CRITICAL: ${crit} | HIGH: ${high}"
            line="${line}"$'\n'"   📄 Report: ${URL}"
          else
            line="🔐 Trivy Scan: ⏭️ skipped (no scan trigger)"
          fi

          {
            echo "value<<EOF"
            printf '%s\n' "$line"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compose SAST line
        id: sast_line
        env:
          RESULT: ${{ needs.sast-scan.result }}
          SCANNED: ${{ needs.sast-scan.outputs.SCANNED }}
          MESSAGE: ${{ needs.sast-scan.outputs.MESSAGE }}
        run: |
          set -euo pipefail

          # A job that died before scan.sh ran leaves MESSAGE empty. Silence there would
          # read as a clean scan, so say so explicitly instead. SAST is not trigger-gated
          # — it runs on every build — so the only way it does not run is that there was
          # no build: a pull_request event, or build-image failed.
          if [[ "$SCANNED" != "true" ]]; then
            line="🔍 SAST (Semgrep): ⏭️ skipped (no build to scan)"
          elif [[ -n "$MESSAGE" ]]; then
            line="$MESSAGE"
          else
            line="🔍 SAST (Semgrep): ❌ scan job failed before reporting (${RESULT})"
          fi

          {
            echo "value<<EOF"
            printf '%s\n' "$line"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compose DAST line
        id: dast_line
        env:
          RESULT: ${{ needs.dast-scan.result }}
          SCANNED: ${{ needs.dast-scan.outputs.SCANNED }}
          MESSAGE: ${{ needs.dast-scan.outputs.MESSAGE }}
        run: |
          set -euo pipefail

          # Four states reach here and none of them may be silent: not scanned at all,
          # scanned with a verdict scan.sh already worded, or a job that died before
          # scan.sh could word anything.
          if [[ "$SCANNED" != "true" ]]; then
            line="🕷 DAST (ZAP): ⏭️ skipped (not a DAST trigger or repository)"
          elif [[ -n "$MESSAGE" ]]; then
            line="$MESSAGE"
          else
            line="🕷 DAST (ZAP): ❌ scan job failed before reporting (${RESULT})"
          fi

          {
            echo "value<<EOF"
            printf '%s\n' "$line"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compose API-scan line
        id: api_scan_line
        env:
          RESULT: ${{ needs.api-scan.result }}
          SCANNED: ${{ needs.api-scan.outputs.SCANNED }}
          MESSAGE: ${{ needs.api-scan.outputs.MESSAGE }}
        run: |
          set -euo pipefail

          # Four states reach here and none of them may be silent: not scanned at all,
          # scanned with a verdict scan.sh already worded, or a job that died before
          # scan.sh could word anything.
          if [[ "$SCANNED" != "true" ]]; then
            line="🕷 API Scan (ZAP): ⏭️ skipped (not an apiscan trigger or repository)"
          elif [[ -n "$MESSAGE" ]]; then
            line="$MESSAGE"
          else
            line="🕷 API Scan (ZAP): ❌ scan job failed before reporting (${RESULT})"
          fi

          {
            echo "value<<EOF"
            printf '%s\n' "$line"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set Telegram Message
        uses: novaitdevteam/nova.ci/.github/actions/action-cond@main
        id: telegram_message
        with:
          cond: ${{ contains(join(needs.build-image.result, ','), 'success') }}
          if_true: |
            👷 ${{ github.actor }} created deploy tag.

            Image building has been completed ✅

            ▶️ GitHub Public Registry: ghcr.io/${{ github.repository_owner }}/${{ needs.build-image.outputs.REP_NAME }}
            🔗 docker pull ghcr.io/${{ github.repository_owner }}/${{ needs.build-image.outputs.REP_NAME }}:${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}

            ▶️ Docker Private Registry: ${{ secrets.CR_DH_USERNAME }}/${{ needs.build-image.outputs.REP_NAME }}
            🔗 docker pull docker.io/${{ secrets.CR_DH_USERNAME }}/${{ needs.build-image.outputs.REP_NAME }}:${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}

            🔵 Image Name: ${{ needs.build-image.outputs.RELEASE }}_${{ needs.build-image.outputs.SHORT_REF_NAME }}${{ needs.build-image.outputs.IMAGE_SUFFIX }}_${{ needs.build-image.outputs.SHORT_SHA }}

            ESLinter Check Status: ${{ needs.linter.outputs.LINTER_CHECK }}
            Unit Tests Status: ${{ needs.unit-test.outputs.UNIT_CHECK }}

            ${{ steps.trivy_line.outputs.value }}

            ${{ steps.sast_line.outputs.value }}

            ${{ steps.dast_line.outputs.value }}

            ${{ steps.api_scan_line.outputs.value }}

            Repository: ${{ github.repository }}
            See changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}
          if_false: |
            👷 ${{ github.actor }} created deploy tag.

            ❌Build Failed

            ESLinter Check Status: ${{ needs.linter.outputs.LINTER_CHECK }}
            Unit Tests Status: ${{ needs.unit-test.outputs.UNIT_CHECK }}

            🔗 See Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.build-image.outputs.END_STEP_JOB_ID}}
            Repository: ${{ github.repository }}

      - name: Notify
        uses: novaitdevteam/nova.ci/.github/actions/notify@main
        with:
          message: ${{ steps.telegram_message.outputs.value }}
          telegram_token: ${{ secrets.TG_NOTIFICATION_BOT_TOKEN }}
          telegram_to: ${{ secrets.TG_NOTIFICATION_BOT_ID }}
          gchat_webhook: ${{ secrets.GC_NOTIFICATION_WEBHOOK }}
