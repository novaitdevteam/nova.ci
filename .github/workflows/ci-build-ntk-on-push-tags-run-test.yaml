name: CI Build NTK on Push TAG
on:
  workflow_call:
    inputs:
      runner_labels:
        required: false
        type: string
      test_mode:
        required: false
        type: string
        default: "integration"   # one of: unit | integration | both
  workflow_dispatch:
    inputs:
      test_mode:
        required: false
        type: choice
        default: "integration"
        options:
          - integration
          - unit
          - both

env:
  #DATABASE CONFIG
  DATABASE_DIALECT: postgres
  # Integration DBs run as host-published containers, reached on localhost.
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: 5432
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: password
  DATABASE_NAME: db_name

jobs:
  delete-tag:
    permissions:
      contents: write
    name: Delete Trigger Tag
    runs-on: ${{ inputs.runner_labels || 'self-hosted' }}
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - name: Delete Tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_NAME;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Deleted tag ${tag}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.warning(`Tag ${tag} not found, skipping deletion.`);
              } else {
                throw error;
              }
            }

  unit-tests:
    permissions:
      contents: read
    name: Unit Tests
    runs-on: ${{ inputs.runner_labels || 'self-hosted' }}
    if: ${{ contains(fromJSON('["unit","both"]'), inputs.test_mode || 'integration') }}
    outputs:
      REPORT: ${{ steps.report.outputs.artifact-url }}
      SUMMARY: ${{ steps.summary.outputs.SUMMARY }}
    steps:
      - name: Checkout
        # Check out the commit SHA, not the trigger tag: the parallel delete-tag job
        # removes refs/tags/<tag>, so a tag-based checkout would race and fail.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 💿 Setup NODEJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: ▶️ Get Env From Example
        # novatalks.rag's tests overwrite every connection value with their own
        # (test/support/test-env.ts), so its example would only add stray keys.
        if: ${{ github.event.repository.name != 'novatalks.rag' }}
        run: |
          sed '/^#/d' .env.example > .env
          # $GITHUB_ENV takes a line literally, so `FILE_MAX_SIZE=10485760 #10mb` arrived as
          # NaN and LDAP_URL with its quotes, failing core's boot validation (NC2-2916).
          # Node's own dotenv parser strips both, as a local dotenv run does, and skips
          # bare keys such as MESSAGE_EXTERNAL_SOURCE_LAST_ID.
          node -e 'for (const [k, v] of Object.entries(require("node:util").parseEnv(require("node:fs").readFileSync(".env.example", "utf8"))))
            process.stdout.write(v.includes("\n") ? k + "<<NOVA_CI_ENV_EOF\n" + v + "\nNOVA_CI_ENV_EOF\n" : k + "=" + v + "\n")' >> "$GITHUB_ENV"

      - name: ⏬ Install Dependencies
        env:
          NODE_ENV: development
        run: |
          npm pkg delete scripts.prepare
          npm ci

      - name: 🧪 Run Unit Tests
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          LOG_LEVEL: "error"
          # The command lives in the repository's own package.json: novatalks.rag has no
          # test:unit, its unit project is `npm test`.
          UNIT_SCRIPT: ${{ github.event.repository.name == 'novatalks.rag' && 'test' || 'test:unit' }}
        run: |
          set -o pipefail
          npm run "$UNIT_SCRIPT" 2>&1 | tee results.txt

      - name: 📊 Summarize results
        if: always()
        id: summary
        env:
          LABEL: Unit
        run: |
          tests="n/a"; suites="n/a"
          if [ -f results.txt ]; then
            t=$(grep -E '^Tests:' results.txt | tail -1 | sed -E 's/^Tests:[[:space:]]*//'); [ -n "$t" ] && tests="$t"
            s=$(grep -E '^Test Suites:' results.txt | tail -1 | sed -E 's/^Test Suites:[[:space:]]*//'); [ -n "$s" ] && suites="$s"
          fi
          echo "SUMMARY=Tests: ${tests} | Suites: ${suites}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${LABEL} tests"
            echo "- **Tests:** ${tests}"
            echo "- **Suites:** ${suites}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # A full organisation-wide artifact quota must not red a test run: the job's result is
        # the tests', and the failed upload stays visible as this step's annotation.
        continue-on-error: true
        if: ${{ !cancelled() }}
        id: report
        with:
          name: unit-test-report
          path: ./results.txt
          retention-days: 30

  integration-tests:
    permissions:
      contents: read
    name: Integration Tests
    runs-on: ${{ inputs.runner_labels || 'self-hosted' }}
    # Sequenced after unit-tests so a full-test (both) run reuses one runner instead of
    # taking two large VMs in parallel. `!cancelled()` keeps integration running when
    # unit-tests is skipped (mode: integration) or failed (mode: both — suites report
    # independently in the notifier).
    needs: [unit-tests]
    if: ${{ !cancelled() && contains(fromJSON('["integration","both"]'), inputs.test_mode || 'integration') }}
    outputs:
      REPORT: ${{ steps.report.outputs.artifact-url }}
      SUMMARY: ${{ steps.summary.outputs.SUMMARY }}
    steps:
      - name: Checkout
        # Check out the commit SHA, not the trigger tag: the parallel delete-tag job
        # removes refs/tags/<tag>, so a tag-based checkout would race and fail.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # GitHub `services:` start before any step, so they require Docker pre-installed on
      # the runner image (which the self-hosted image lacks). Instead install Docker here
      # and run Postgres + Redis manually with host port mapping, so DATABASE_HOST /
      # REDIS_HOST (127.0.0.1 / localhost) reach the published ports.
      - name: 🐳 Ensure Docker
        uses: novaitdevteam/nova.ci/.github/actions/install-docker@main

      - name: 🐘 Start Postgres + Redis
        env:
          # novatalks.core mirrors the production PG major version (PG 17.9); novatalks.rag
          # needs pgvector 0.8 (its docker-compose.test.yaml pin); others use postgres:16.
          PG_IMAGE: ${{ github.event.repository.name == 'novatalks.core' && 'postgres:17.9-trixie' || github.event.repository.name == 'novatalks.rag' && 'pgvector/pgvector:0.8.7-pg16' || 'postgres:16' }}
          # rag's tests hardcode database `rag` (test/support/test-env.ts), and a parallel
          # HNSW build needs more than Docker's 64 MB of shared memory.
          PG_DB: ${{ github.event.repository.name == 'novatalks.rag' && 'rag' || env.DATABASE_NAME }}
          PG_SHM: ${{ github.event.repository.name == 'novatalks.rag' && '1g' || '64m' }}
        run: |
          set -euo pipefail
          docker rm -f nova-pg nova-redis >/dev/null 2>&1 || true
          docker run -d --name nova-pg --shm-size="$PG_SHM" \
            -e POSTGRES_PASSWORD="$DATABASE_PASSWORD" \
            -e POSTGRES_DB="$PG_DB" \
            -e POSTGRES_USER="$DATABASE_USERNAME" \
            -p 5432:5432 "$PG_IMAGE"
          docker run -d --name nova-redis -p 6379:6379 redis:8

          echo "Waiting for Postgres..."
          for _ in $(seq 1 30); do
            docker exec nova-pg pg_isready -U "$DATABASE_USERNAME" -d "$PG_DB" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec nova-pg pg_isready -U "$DATABASE_USERNAME" -d "$PG_DB"

          echo "Waiting for Redis..."
          for _ in $(seq 1 15); do
            [ "$(docker exec nova-redis redis-cli ping 2>/dev/null)" = "PONG" ] && break
            sleep 1
          done
          docker exec nova-redis redis-cli ping

      - name: 💿 Setup NODEJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: ▶️ Get Env From Example
        # novatalks.rag's tests overwrite every connection value with their own
        # (test/support/test-env.ts), so its example would only add stray keys.
        if: ${{ github.event.repository.name != 'novatalks.rag' }}
        run: |
          sed '/^#/d' .env.example > .env
          # $GITHUB_ENV takes a line literally, so `FILE_MAX_SIZE=10485760 #10mb` arrived as
          # NaN and LDAP_URL with its quotes, failing core's boot validation (NC2-2916).
          # Node's own dotenv parser strips both, as a local dotenv run does, and skips
          # bare keys such as MESSAGE_EXTERNAL_SOURCE_LAST_ID.
          node -e 'for (const [k, v] of Object.entries(require("node:util").parseEnv(require("node:fs").readFileSync(".env.example", "utf8"))))
            process.stdout.write(v.includes("\n") ? k + "<<NOVA_CI_ENV_EOF\n" + v + "\nNOVA_CI_ENV_EOF\n" : k + "=" + v + "\n")' >> "$GITHUB_ENV"

      - name: ⏬ Install Dependencies
        env:
          NODE_ENV: development
        run: |
          npm pkg delete scripts.prepare
          npm ci

      - name: Enable pgcrypto extension
        if: ${{ github.event.repository.name != 'novatalks.rag' }}
        run: |
          docker exec -e PGPASSWORD="$DATABASE_PASSWORD" nova-pg \
            psql -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      # novatalks.rag: its roles and the vector extension come from the checkout's own
      # docker/init-db.sql (the tests migrate in globalSetup but create neither), and its
      # storage specs need a MinIO with bucket rag-kb. The tests overwrite every connection
      # value with hardcoded ones — database `rag`, MinIO rag / rag-test-secret, bucket
      # rag-kb, host 127.0.0.1 (test/support/test-env.ts) — so these are matched, not
      # chosen. Postgres is docker-compose.test.yaml's pin. MinIO is not: its pin
      # (minio/minio:RELEASE.2025-09-07T16-13-09Z) no longer pulls — MinIO withdrew its
      # images from Docker Hub and quay — so the server and the client come from
      # Chainguard's free images, pinned by digest. The ports are preset so the
      # tests never ask `docker compose` (test/support/test-ports.ts), which the runners
      # are not known to have.
      - name: 🧩 Prepare novatalks.rag's database and object storage
        if: ${{ github.event.repository.name == 'novatalks.rag' }}
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD="$DATABASE_PASSWORD" nova-pg \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U "$DATABASE_USERNAME" -d rag < docker/init-db.sql
          docker rm -f nova-minio >/dev/null 2>&1 || true
          docker run -d --name nova-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rag -e MINIO_ROOT_PASSWORD=rag-test-secret \
            cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597 server /data
          created=no
          for _ in $(seq 1 30); do
            if docker run --rm --network host -e MC_HOST_local=http://rag:rag-test-secret@127.0.0.1:9000 \
              cgr.dev/chainguard/minio-client@sha256:1dccd2a6fd59914a98ac2d9dad95e552c91243cb0bd7242aaa224802df4b3432 \
              mb --ignore-existing local/rag-kb; then created=yes; break; fi
            sleep 2
          done
          if [ "$created" != yes ]; then
            docker logs --tail 40 nova-minio || true
            echo "::error::MinIO never accepted the rag-kb bucket"; exit 1
          fi
          {
            echo "RAG_TEST_FOUND_RAG_POSTGRES_TEST_PORT=5432"
            echo "RAG_TEST_FOUND_RAG_REDIS_TEST_PORT=6379"
            echo "RAG_TEST_FOUND_RAG_S3_TEST_PORT=9000"
          } >> "$GITHUB_ENV"

      # novatalks.core integration tests exercise S3 (Cloudflare R2) file storage.
      # Inject the R2 credentials for novatalks.core only, so other repos (e.g. engine)
      # keep their default FILE_DRIVER and are unaffected. Secrets are passed via step env
      # (not inline ${{ secrets }} in run) so they are masked and never rendered into the script.
      - name: ⚙️ Configure S3 (Cloudflare R2) file storage
        if: ${{ github.event.repository.name == 'novatalks.core' }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          {
            echo "FILE_DRIVER=s3"
            echo "AWS_S3_ENDPOINT=$R2_ENDPOINT"
            echo "AWS_S3_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "AWS_S3_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo "AWS_S3_BUCKET=$R2_BUCKET"
            echo "AWS_S3_REGION=auto"
            echo "AWS_S3_FORCE_PATH_STYLE=true"
          } >> "$GITHUB_ENV"

      # novatalks.core refuses to boot with a blank ENCRYPTION_SECRET or AUTH_JWT_SECRET
      # under any NODE_ENV, and .env.example ships both blank on purpose. It also enables
      # SDK auth and the ldap provider with their values blank, which needs
      # SDK_AUTH_TOKEN_SECRET and the two LDAP DNs (NC2-2916). Secrets are generated per
      # run and masked before anything can print them; the DNs are placeholders at
      # example.invalid. A later $GITHUB_ENV entry wins over "Get Env From Example".
      - name: 🔐 Generate boot secrets
        run: |
          ENCRYPTION_SECRET="$(openssl rand -hex 32)"
          AUTH_JWT_SECRET="$(openssl rand -hex 32)"
          SDK_AUTH_TOKEN_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$ENCRYPTION_SECRET"
          echo "::add-mask::$AUTH_JWT_SECRET"
          echo "::add-mask::$SDK_AUTH_TOKEN_SECRET"
          {
            echo "ENCRYPTION_SECRET=$ENCRYPTION_SECRET"
            echo "AUTH_JWT_SECRET=$AUTH_JWT_SECRET"
            echo "SDK_AUTH_TOKEN_SECRET=$SDK_AUTH_TOKEN_SECRET"
            echo "LDAP_BIND_DN=cn=ci,dc=example,dc=invalid"
            echo "LDAP_SEARCH_BASE=dc=example,dc=invalid"
          } >> "$GITHUB_ENV"

      # Integration sharding (jest --shard with a matrix) is intentionally NOT enabled by
      # default because integration tests share DB state and run with --runInBand.
      # To parallelize, give each shard its own postgres/redis service and split with --shard=i/N.
      - name: 🏃 Run Integration Tests
        env:
          # Not 'production': core's env.validation.ts forbids DATABASE_SYNCHRONIZE there,
          # and the specs set it to sync({ force: true }) the schema. Two checks compare to
          # 'production' and are off here: the session cookie's secure flag and Swagger
          # gating (staging would behave the same). NC2-2916; novatalks.core only.
          NODE_ENV: test
          NODE_OPTIONS: "--max-old-space-size=8192"
          LOG_LEVEL: "error"
          UV_THREADPOOL_SIZE: "32"
          FORCE_COLOR: "false"
          NO_COLOR: "true"
          DATABASE_LOGGING: "false"
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee results.txt

      - name: 📊 Summarize results
        if: always()
        id: summary
        env:
          LABEL: Integration
        run: |
          tests="n/a"; suites="n/a"
          if [ -f results.txt ]; then
            t=$(grep -E '^Tests:' results.txt | tail -1 | sed -E 's/^Tests:[[:space:]]*//'); [ -n "$t" ] && tests="$t"
            s=$(grep -E '^Test Suites:' results.txt | tail -1 | sed -E 's/^Test Suites:[[:space:]]*//'); [ -n "$s" ] && suites="$s"
          fi
          echo "SUMMARY=Tests: ${tests} | Suites: ${suites}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${LABEL} tests"
            echo "- **Tests:** ${tests}"
            echo "- **Suites:** ${suites}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # A full organisation-wide artifact quota must not red a test run: the job's result is
        # the tests', and the failed upload stays visible as this step's annotation.
        continue-on-error: true
        if: ${{ !cancelled() }}
        id: report
        with:
          name: integration-test-report
          path: ./results.txt
          retention-days: 30

      - name: 🧹 Tear down containers
        if: always()
        run: docker rm -f nova-pg nova-redis nova-minio >/dev/null 2>&1 || true

  notify-telegram:
    permissions:
      contents: read
    name: Notifier
    runs-on: ${{ inputs.runner_labels || 'self-hosted' }}
    if: always()
    needs: [unit-tests, integration-tests]
    steps:
      - name: Compose report lines
        id: reports
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          UNIT_URL: ${{ needs.unit-tests.outputs.REPORT }}
          UNIT_SUMMARY: ${{ needs.unit-tests.outputs.SUMMARY }}
          INT_RESULT: ${{ needs.integration-tests.result }}
          INT_URL: ${{ needs.integration-tests.outputs.REPORT }}
          INT_SUMMARY: ${{ needs.integration-tests.outputs.SUMMARY }}
        run: |
          set -euo pipefail
          # Map a job result to a clear status label so it is obvious which suite failed.
          label() {
            case "$1" in
              success)   echo "✅ passed" ;;
              failure)   echo "❌ FAILED" ;;
              cancelled) echo "⏹️ cancelled" ;;
              *)         echo "$1" ;;
            esac
          }
          # List status + counts + report only for a job that actually ran (not skipped).
          lines=""
          if [[ "${UNIT_RESULT:-}" != "skipped" ]]; then
            lines="${lines}🧪 Unit: $(label "${UNIT_RESULT:-}") — ${UNIT_SUMMARY:-n/a}"$'\n'
            lines="${lines}   ▶️ Report: ${UNIT_URL:-not stored, see the run}"$'\n\n'
          fi
          if [[ "${INT_RESULT:-}" != "skipped" ]]; then
            lines="${lines}🧩 Integration: $(label "${INT_RESULT:-}") — ${INT_SUMMARY:-n/a}"$'\n'
            lines="${lines}   ▶️ Report: ${INT_URL:-not stored, see the run}"$'\n\n'
          fi
          {
            echo "value<<EOF"
            printf '%s' "$lines"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set Telegram Message
        uses: novaitdevteam/nova.ci/.github/actions/action-cond@main
        id: telegram_message
        with:
          cond: ${{ !contains(join(needs.*.result, ','), 'failure') }}
          if_true: |
            👷 ${{ github.actor }} start test

            Test run (${{ inputs.test_mode || 'integration' }}) completed ✅

            Repository: ${{ github.repository }}
            ${{ steps.reports.outputs.value }}

          if_false: |
            👷 ${{ github.actor }} start test

            ❌ Tests Failed (${{ inputs.test_mode || 'integration' }})

            ${{ steps.reports.outputs.value }}
            🔗 See Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Repository: ${{ github.repository }}

      - name: Notify
        uses: novaitdevteam/nova.ci/.github/actions/notify@main
        with:
          message: ${{ steps.telegram_message.outputs.value }}
          telegram_token: ${{ secrets.TG_NOTIFICATION_BOT_TOKEN }}
          telegram_to: ${{ secrets.TG_NOTIFICATION_BOT_ID }}
          gchat_webhook: ${{ secrets.GC_NOTIFICATION_WEBHOOK }}
