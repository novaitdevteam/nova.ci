name: CI Build NTK Moblie Apps on Push TAG
on:
  workflow_call:
    inputs:
      runner_labels:
        required: false
        type: string

jobs:
  build-apk:
    name: Build APK
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    permissions:
      contents: write
    outputs:
      REP_NAME: ${{ steps.prep.outputs.REP_NAME }}
      SHORT_SHA: ${{ steps.prep.outputs.SHORT_SHA }}
      SHORT_REF_NAME: ${{ steps.prep.outputs.SHORT_REF_NAME }}
      RELEASE: ${{ steps.prep.outputs.RELEASE }}
    steps:
      - name: Remote Checkout Master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ contains(github.ref_name, 'build') && endsWith( github.ref_name, 'apk' ) }}
        with:
          persist-credentials: false
          repository: "novaitdevteam/novatalks.ui-lite"
          github-server-url: https://github.com/novaitdevteam/novatalks.ui-lite
          path: ./novatalks.ui-lite
          ssh-key: ${{ secrets.NTK_UI_LITE_DEPLOY_KEY }}

      - name: Any additional Tag?
        run: |
          if [[ ${GITHUB_REF_NAME} == 'build-apk' ]]; then
            echo "REMOTE_BRANCH=main" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          else
            echo "REMOTE_BRANCH=$(echo "${GITHUB_REF_NAME}" | cut -d "-" -f3-4)" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          fi

      - name: Remote Checkout On Certain branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ contains(github.ref_name, 'build-apk-') }}
        with:
          persist-credentials: false
          repository: "novaitdevteam/novatalks.ui-lite"
          github-server-url: https://github.com/novaitdevteam/novatalks.ui-lite
          path: ./novatalks.ui-lite
          ssh-key: ${{ secrets.NTK_UI_LITE_DEPLOY_KEY }}
          ref: ${{ env.REMOTE_BRANCH }}

      - name: Get Remote SHA
        working-directory: ./novatalks.ui-lite
        run: echo "REMOTE_SHA=$(/usr/bin/git log -1 --format='%H' | cut -c1-8)" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      - name: Install APK Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip unzip

      - name: Prepare Vars
        id: prep
        env:
          BASE_REF: ${{ github.event.base_ref }}
        run: |
          echo "REP_NAME=$(echo "${GITHUB_REPOSITORY}" | cut -d "/" -f2 )" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          echo "RELEASE=$(date +'%Y_R%q')" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          if [[ ${GITHUB_REF_TYPE} == 'branch' ]]; then
            echo "SHORT_REF_NAME=${GITHUB_REF_NAME//[^A-Za-z0-9_.-]/-}" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          else
            echo "SHORT_REF_NAME=$(echo "${BASE_REF}" | cut -d "/" -f3 | sed 's#[^A-Za-z0-9_.-]#-#g')" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          fi

      - name: Set new vars
        run: |
          echo "SHORT_SHA=${REMOTE_SHA}" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          echo "SHORT_REF_NAME=${REMOTE_BRANCH//[^A-Za-z0-9_.-]/-}" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      - name: Delete Tag
        uses: dev-drprasad/delete-tag-and-release@82600feb9527126eca69833f07bafe53279bd9b4 # v1.1
        with:
          #delete_release: false # default: false
          tag_name: ${{ github.ref_name }} # tag name to delete
          github_token: ${{ secrets.GITHUB_TOKEN }}
          #repo: ${{ github.repository_owner }}/${{ env.REP_NAME }} # target repo (optional). defaults to repo running this action

      - name: 💿 Setup NODEJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node_inst
        with:
          node-version: "22.22.0"

      - name: 💿 Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: 💿 Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: 8.0.2
          cache-disabled: true

      - name: 💿 Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Generating Release Key
        working-directory: ./novatalks.ui-lite
        run: |
          keytool -genkey -dname "cn=NovaitDevTeam, ou=IT, o=NovaIT, l=Kyiv, st=Kyiv, c=UA" -v -keystore ./release-key.keystore -alias ntk-ui-lite-release-key -keyalg RSA -keysize 2048 -validity 20000 -storepass android -keypass android

      - name: Displaying debug.keystore file
        working-directory: ./novatalks.ui-lite
        run: |
          keytool -list -v -keystore ./release-key.keystore -alias ntk-ui-lite-release-key -storepass android -keypass android

      - name: Setup Components & Build
        working-directory: ./novatalks.ui-lite
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ ! -d "$android_sdk" ]]; then
            for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk "$HOME/.android/sdk"; do
              if [[ -n "$candidate" && -d "$candidate" ]]; then
                android_sdk="$candidate"
                break
              fi
            done
          fi
          if [[ ! -d "$android_sdk" ]]; then
            echo "Android SDK directory not found. ANDROID_HOME=${ANDROID_HOME:-}, ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}" >&2
            exit 1
          fi
          export ANDROID_HOME="$android_sdk"
          export ANDROID_SDK_ROOT="$android_sdk"
          export PATH=$android_sdk/platform-tools/:$PATH
          export PATH=$android_sdk/cmdline-tools/latest/bin/:$PATH
          export PATH=$android_sdk/emulator/:$PATH
          export PATH=$android_sdk/build-tools/:$PATH
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager not found in PATH for Android SDK directory: $android_sdk" >&2
            exit 1
          fi
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          apksigner="$(find "$android_sdk" -name apksigner -type f | head -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "apksigner not found under Android SDK directory: $android_sdk" >&2
            exit 1
          fi
          echo "Using Android SDK: $android_sdk"

          npm install -g yarn
          yarn_bin="$(yarn global bin)"
          export PATH="$yarn_bin:$PATH"
          yarn global add @quasar/cli
          yarn global add @quasar/icongenie
          yarn install --ignore-engines
          yarn run --ignore-engines icongenie:android
          printf 'sdk.dir=%s\n' "$android_sdk" > ./src-capacitor/android/local.properties
          chmod +x ./src-capacitor/android/gradlew
          quasar build -m capacitor -T android
          mv ./src-capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk ./novatalks-ui-lite-"${SHORT_REF_NAME}"-"${SHORT_SHA}".apk
          "$apksigner" sign --ks ./release-key.keystore --ks-key-alias ntk-ui-lite-release-key --ks-pass pass:android --key-pass pass:android ./novatalks-ui-lite-"${SHORT_REF_NAME}"-"${SHORT_SHA}".apk
          "$apksigner" verify --print-certs ./novatalks-ui-lite-"${SHORT_REF_NAME}"-"${SHORT_SHA}".apk
          cp ./novatalks-ui-lite-"${SHORT_REF_NAME}"-"${SHORT_SHA}".apk /home/runner/work/

      - name: Create a Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: NTK.UI-LITE_${{ env.RELEASE }}_${{ env.SHORT_REF_NAME }}_${{ env.SHORT_SHA }}
          name: NTK.UI-LITE_${{ env.RELEASE }}_${{ env.SHORT_REF_NAME }}_${{ env.SHORT_SHA }}
          body: Automated Deployment
          draft: false
          prerelease: false
          files: ./novatalks.ui-lite/novatalks-ui-lite-${{ env.SHORT_REF_NAME }}-${{ env.SHORT_SHA }}.apk
