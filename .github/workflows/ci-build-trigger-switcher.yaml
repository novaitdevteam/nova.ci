name: CI Build Trigger Switcher
on:
  workflow_call:
    inputs:
      runner_labels:
        required: false
        type: string

jobs:
  preparation:
    name: CI Build Trigger Switcher Start
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    steps:
      - name: Catch Github Events
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo $GITHUB_CONTEXT
          echo ${{ github.event_name == 'push' }}
          echo ${{ contains(github.ref, 'tags') }}
          echo ${{ contains(github.ref, 'build') }}

  # NC2-2742. Required-status-check name, keep it stable:
  #     "CI Build Trigger Switcher / secret-scan"
  # A reusable-workflow job renders as "<caller job name> / <job name>", so this job
  # is defined here inline rather than behind another `uses:` — a third hop would add
  # a third segment to the name every branch ruleset has to match.
  #
  # Scans the commits the event ADDS, never full history, so a legacy finding already
  # sitting in a default branch cannot block an unrelated pull request. That is what
  # makes this safe to make mandatory on day one. See docs/secret-detection.md.
  secret-scan:
    name: secret-scan
    # The NC2-2742 repository list, not the standard-build list: a secret does not care
    # whether a repo publishes an image, so novatalks.chatwidget and novatalks.ui-lite
    # are in even though they are not build repositories.
    #
    # Deliberately NOT in the list, tracked in docs/secret-detection.md:
    #   nova.ci                       - scans itself via ci-self-validate.yaml
    #   novatalks.tests               - out of scope (test automation, no notifier secrets)
    #   genesys...wizard.engine       - deprecated
    #   nova.ai.marketplace           - out of scope (also has no caller workflow)
    #   novatalks.charts              - out of scope (also has no caller workflow)
    #   novatalks.grafana.connector   - out of scope (also has no caller workflow)
    # Do not add a repository here without also confirming it is still live.
    if:
      ${{ contains(fromJSON('["novatalks.core", "novatalks.ui", "novatalks.ui-lite", "nova.botflow", "novatalks.dialer", "novatalks.chatwidget", "novatalks.geoip-api", "novatalks.uspacy.connector", "nova.chatsconnector.telegram-client-api", "nova.chatsconnector.whatsapp-client-api", "nova.chatsconnector.signal-client-api" ]'), github.event.repository.name)
      && (
        (github.event_name == 'pull_request'
          && contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action))
        || (github.event_name == 'push'
          && github.ref_type == 'branch'
          && (github.ref_name == github.event.repository.default_branch
            || contains(fromJSON('["main", "master", "development"]'), github.ref_name)))
      ) }}
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    # Read-only. The scan reads commits and writes a job summary; it needs nothing
    # else, and a leak-detection job is the last place to hold a write token.
    permissions:
      contents: read
    # Outputs survive the job failing, which is the only case the notifier cares about.
    outputs:
      outcome: ${{ steps.gitleaks.outputs.outcome }}
      message: ${{ steps.gitleaks.outputs.message }}
    steps:
      # fetch-depth: 0 because the scan needs the base commit and the pull request's
      # own commits in the clone. scan.sh fails closed if a SHA is missing rather
      # than scanning an empty range.
      # ponytail: full clone; narrow to the commit range if clone time on
      #           novatalks.core ever dominates this job.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        id: gitleaks
        uses: novaitdevteam/nova.ci/.github/actions/gitleaks@main

  # Compensating control for the free plan, where a red check cannot actually block a
  # merge (docs/secret-detection.md#what-we-lose-without-enforcement). If nothing stops
  # the credential from landing, the least we can do is make sure a human hears about it
  # within the minute instead of at the next audit.
  #
  # The message is composed in scan.sh, not here, so scripts/test-secret-scan.sh covers
  # it — a chat alert that is subtly wrong is worse than no alert. Docker-free and routed
  # through .github/actions/notify like every other notifier here; validate.sh fails on a
  # workflow that reaches Telegram or Google Chat itself.
  secret-scan-notify:
    name: secret-scan notify
    needs: [secret-scan]
    if: ${{ always() && needs.secret-scan.result == 'failure' }}
    runs-on: ${{ inputs.runner_labels  || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - name: Notify
        uses: novaitdevteam/nova.ci/.github/actions/notify@main
        with:
          # Falls back to a bare line if the job died before scan.sh could compose one
          # (runner lost, download failed) — silence would look like a clean run.
          message: ${{ needs.secret-scan.outputs.message || format('🔧 secret-scan did not complete on {0} — this change is UNSCANNED. {1}/{0}/actions/runs/{2}', github.repository, github.server_url, github.run_id) }}
          telegram_token: ${{ secrets.TG_NOTIFICATION_BOT_TOKEN }}
          telegram_to: ${{ secrets.TG_NOTIFICATION_BOT_ID }}
          gchat_webhook: ${{ secrets.GC_NOTIFICATION_WEBHOOK }}

  call-external-on-push-tags:
    name: Call Builder On Push Tags
    if: ${{ contains(fromJSON('["novatalks.core", "novatalks.ui", "nova.botflow", "nova.chatsconnector.telegram-client-api", "novatalks.dialer", "nova.chatsconnector.genesys.cloud.premium.wizard.engine", "novatalks.geoip-api", "nova.chatsconnector.whatsapp-client-api", "nova.chatsconnector.signal-client-api", "novatalks.uspacy.connector" ]'), github.event.repository.name) && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && (contains(github.ref_name, 'build') || startsWith(github.ref_name, 'scan')) }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-build.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  # LEGACY (disabled 2026-08-12): branch-push build route.
  #
  # `contains(head_commit.message, 'build')` matched the substring anywhere in the
  # FULL commit message, body included, so ordinary prose triggered a full build and
  # image push from feature branches. Real examples:
  #   - "Specs build partial module graphs with Test.createTestingModule"  (run 31576663619)
  #   - "Verified: nest build, tsc --noEmit ... (3 build errors)"          (run 31607179275)
  # Both fired on plain feature-branch pushes and were mistaken for PR builds.
  #
  # Kept commented for now instead of deleted, in case a branch-push route is needed
  # again. If it comes back, gate it on an explicit marker (e.g. `[build]`) and/or a
  # branch allowlist — not a bare `build` substring. Tag pushes (`build*` / `scan*`)
  # and pull requests are unaffected.
  #
  # call-external-on-pull-request-merged:
  #   name: Call Builder On Merge PR
  #   if: ${{ contains(fromJSON('["novatalks.core", "novatalks.ui", "nova.botflow", "nova.chatsconnector.telegram-client-api", "novatalks.dialer", "nova.chatsconnector.genesys.cloud.premium.wizard.engine", "novatalks.geoip-api", "nova.chatsconnector.whatsapp-client-api", "nova.chatsconnector.signal-client-api", "novatalks.uspacy.connector" ]'), github.event.repository.name) && github.event_name == 'push' && github.ref_type == 'branch' && contains(github.event.head_commit.message, 'build') }}
  #   uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-build.yaml@main
  #   secrets: inherit
  #   with:
  #     runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  # Drafts are linted too, and `!github.event.pull_request.draft` is deliberately absent
  # from both pull request routes below. Skipping drafts looked like a saving and was in
  # fact a hole: `pull_request:` in the product callers carries no `types:`, so GitHub
  # sends only `opened`, `synchronize` and `reopened` — never `ready_for_review`. A pull
  # request opened as a draft and then marked ready therefore got no lint and no unit
  # tests at all, and reported `skipped` rather than red, so nobody noticed.
  # novatalks.core#217 sat open for a month that way.
  #
  # `ready_for_review` stays listed in the action lists: it is inert with today's callers
  # but correct the moment one subscribes to it.
  #
  # Every head SHA now arrives through `opened` or `synchronize`, so marking a pull
  # request ready needs no event of its own — the check already sits on that SHA. Cost:
  # a push to a draft occupies a self-hosted runner for lint and unit. Image builds are
  # unaffected, still gated on `github.event_name != 'pull_request'`.
  call-external-on-pull-request-novatalks-core:
    name: Call Core Builder On Pull Request (${{ matrix.build_target }})
    if:
      ${{ github.event.repository.name == 'novatalks.core'
      && github.event_name == 'pull_request'
      && contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action) }}
    strategy:
      fail-fast: false
      matrix:
        build_target:
          - build-engine
          - build-reporting
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-build.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}
      build_target: ${{ matrix.build_target }}

  call-external-on-pull-request-build:
    name: Call Builder On Pull Request
    if:
      ${{ contains(fromJSON('["novatalks.ui", "nova.botflow", "nova.chatsconnector.telegram-client-api", "novatalks.dialer", "nova.chatsconnector.genesys.cloud.premium.wizard.engine", "novatalks.geoip-api", "nova.chatsconnector.whatsapp-client-api", "nova.chatsconnector.signal-client-api", "novatalks.uspacy.connector" ]'), github.event.repository.name)
      && github.event_name == 'pull_request'
      && contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action) }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-build.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}
      build_target: build

  call-external-on-push-tags-run-test:
    name: Call Test Runner On Push Tags
    if:
      ${{ github.event.repository.name == 'novatalks.core'
      && github.event_name == 'push'
      && github.ref_type == 'tag'
      && (contains(github.ref_name, 'int-test') || contains(github.ref_name, 'unit-test') || contains(github.ref_name, 'full-test')) }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-run-test.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}
      test_mode: ${{ contains(github.ref_name, 'full-test') && 'both' || (contains(github.ref_name, 'unit-test') && 'unit' || 'integration') }}

  call-external-on-push-tags-gh-deploy:
    name: Call GH Pages Deploy On Push Tags
    if: ${{ github.event.repository.name == 'nova.docs' && github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'build') }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-gh-deploy.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  call-external-on-push-tags-mob-apk-build:
    name: Call Mobile APK Build On Push Tags
    if: ${{ github.event.repository.name == 'novatalks.ui-lite' && github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'build-apk') }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-mob-apk-build.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  call-external-on-push-tags-mob-apk-build-public:
    name: Call Mobile APK Build On Push Tags
    if: ${{ github.event.repository.name == 'novatalks.mobile' && github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'build-apk') }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-mob-apk-build-public.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  call-external-on-push-tags-mob-pwa-build:
    name: Call Mobile PWA Build On Push Tags
    if: ${{ github.event.repository.name == 'novatalks.ui-lite' && github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'build-pwa') }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-mob-pwa-build.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  call-external-on-push-tags-mob-spa-build:
    name: Call Mobile SPA Build On Push Tags
    if: ${{ github.event.repository.name == 'novatalks.ui-lite' && github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'build-spa') }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-mob-pwa-build.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  call-external-on-push-tags-crm-build:
    name: Call Crm Build On Push Tags
    if: ${{ github.event.repository.name == 'novatalks.ui-lite' && github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'build-crm') }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-mob-pwa-build.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  call-external-on-push-tags-widget-build:
    name: Call GH Pages Deploy On Push Tags
    if: ${{ github.event.repository.name == 'novatalks.chatwidget' && github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'build') }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-widget-build.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  call-external-on-push-branches:
    name: Call Builder If Push Certain Branches
    if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && contains(github.ref_name, 'build-me-please') }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-branches.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  # call-external-on-push-branches-e2e-tests:
  #   name: Call Playwright Tests
  #   if: ${{ github.event.repository.name == 'novatalks.tests' && github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'playtest') }}
  #   uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-run-e2e.yaml@main
  #   secrets: inherit
  #   with:
  #     runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  call-external-on-push-branches-flows-to-pub:
    name: Call Notifier To Google Chat
    if: ${{ github.event.repository.name == 'novatalks.botflow.flows' && github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'build') }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-build-ntk-on-push-tags-flows-to-pub.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}

  call-external-on-push-branches-e2e-tests-manual:
    name: Call Playwright Tests manual
    if: ${{ github.event.repository.name == 'novatalks.tests' && github.event_name == 'push' && github.ref_type == 'tag' }}
    uses: novaitdevteam/nova.ci/.github/workflows/ci-e2e-tests-manual.yaml@main
    secrets: inherit
    with:
      runner_labels: ${{ inputs.runner_labels  || 'self-hosted' }}
