version: 2
updates:
  # Every third-party action is pinned by commit SHA with its version as a comment
  # (`@<sha> # v6.1.0`); Dependabot moves the SHA and the comment together. Without it
  # the pins would only ever age. nova.ci's own `@main` references are branch refs,
  # which Dependabot leaves alone.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # A release gets a week to be yanked before it is proposed here: every merge to
    # main goes live in every caller repository at once, with no staging.
    cooldown:
      default-days: 7
    groups:
      # One PR a week for patch and minor bumps; a major gets its own PR, because
      # it can change inputs or defaults.
      minor-and-patch:
        update-types: [minor, patch]
        # 0.x: a minor bump is a breaking release, and for trivy-action it also moves the
        # Trivy binary and its DB and cache behaviour. It gets its own PR.
        exclude-patterns:
          - "aquasecurity/*"
    ignore:
      # gradle/actions v6 moved its caching into gradle-actions-caching, a proprietary
      # component under Gradle's Terms of Use, which upgrading accepts
      # (https://blog.gradle.org/github-actions-for-gradle-v6). That is a licensing
      # decision for the organisation, not a pin bump; v5 stays MIT. Remove this entry
      # only together with that decision.
      - dependency-name: "gradle/actions*"
        versions: [">= 6"]
    commit-message:
      prefix: "ci"
