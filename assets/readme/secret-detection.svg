<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="480" viewBox="0 0 1200 480"
     role="img" aria-labelledby="sdTitle sdDesc">
  <title id="sdTitle">Gitleaks scans the commits a change adds, never full history</title>
  <desc id="sdDesc">Pull requests are scanned from the merge base to the head, and pushes to a protected branch from before to after. Tag pushes and plain feature-branch pushes are not scanned. Only the commits the change adds are read, so a finding already merged into history never blocks an unrelated pull request. A clean range passes the check; a secret fails the job with exit code 1 and sends a redacted alert to Telegram and Google Chat.</desc>

  <rect width="1200" height="480" rx="20" fill="#0B0E11"/>

  <text x="40" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="19" letter-spacing="2.2" fill="#8B96A2">SECRET DETECTION</text>
  <text x="1160" y="46" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" fill="#6E7A87">gitleaks 8.30.1 · pinned by tag and SHA-256</text>

  <text x="40" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" letter-spacing="1.6" fill="#6E7A87">TRIGGER</text>
  <text x="362" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" letter-spacing="1.6" fill="#6E7A87">WHAT IS READ</text>
  <text x="872" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" letter-spacing="1.6" fill="#6E7A87">RESULT</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g id="sd-triggers">
      <rect x="40" y="110" width="280" height="70" rx="10" fill="#101519" stroke="#1F93FF" stroke-width="1.5"/>
      <text x="64" y="141" font-size="20" fill="#F4F6F8">pull_request</text>
      <text x="64" y="167" font-size="18" fill="#8B96A2">merge-base..head</text>

      <rect x="40" y="196" width="280" height="70" rx="10" fill="#101519" stroke="#1F93FF" stroke-width="1.5"/>
      <text x="64" y="227" font-size="20" fill="#F4F6F8">push</text>
      <text x="64" y="253" font-size="18" fill="#8B96A2">before..after</text>

      <rect x="40" y="282" width="280" height="70" rx="10" fill="#0F1317" stroke="#1F2429" stroke-width="1.5"/>
      <text x="64" y="313" font-size="20" fill="#6E7A87">tag · feature ref</text>
      <text x="64" y="339" font-size="18" fill="#6E7A87">not scanned</text>
    </g>

    <g id="sd-range">
      <rect x="362" y="110" width="450" height="242" rx="14" fill="#14181D" stroke="#39424B" stroke-width="1.5"/>
      <text x="386" y="150" font-size="20" fill="#F4F6F8">only the commits the change adds</text>
      <text x="386" y="178" font-size="18" fill="#8B96A2">never full history</text>

      <text x="462" y="212" text-anchor="middle" font-size="18" fill="#F85149">legacy finding</text>
      <path d="M458 222 V 240" fill="none" stroke="#F85149" stroke-width="1.5" stroke-dasharray="3 3"/>

      <path d="M386 252 H 778" fill="none" stroke="#2A3138" stroke-width="2"/>

      <g fill="#1F2429" stroke="#39424B" stroke-width="1.5">
        <circle cx="396" cy="252" r="7"/>
        <circle cx="520" cy="252" r="7"/>
      </g>
      <circle cx="458" cy="252" r="7" fill="#1F2429" stroke="#F85149" stroke-width="2"/>

      <g fill="#1F93FF">
        <circle cx="582" cy="252" r="7"/>
        <circle cx="644" cy="252" r="7"/>
        <circle cx="706" cy="252" r="7"/>
        <circle cx="768" cy="252" r="7"/>
      </g>

      <g fill="none" stroke-width="1.5">
        <path d="M396 276 v 6 M396 282 H 520 M520 276 v 6" stroke="#39424B"/>
        <path d="M582 276 v 6 M582 282 H 768 M768 276 v 6" stroke="#1F93FF"/>
      </g>
      <text x="458" y="308" text-anchor="middle" font-size="18" fill="#6E7A87">already merged</text>
      <text x="675" y="308" text-anchor="middle" font-size="18" fill="#1F93FF">scanned</text>
      <text x="386" y="336" font-size="18" fill="#6E7A87">a merged finding never blocks a PR</text>
    </g>

    <g id="sd-results">
      <rect x="872" y="110" width="288" height="70" rx="10" fill="#161B20" stroke="#3FB950" stroke-width="1.5"/>
      <text x="896" y="141" font-size="20" fill="#F4F6F8">clean</text>
      <text x="896" y="167" font-size="18" fill="#8B96A2">check passes</text>

      <rect x="872" y="196" width="288" height="70" rx="10" fill="#161B20" stroke="#F85149" stroke-width="1.5"/>
      <text x="896" y="227" font-size="20" fill="#F4F6F8">secret found</text>
      <text x="896" y="253" font-size="18" fill="#8B96A2">job fails · exit 1</text>

      <rect x="872" y="282" width="288" height="70" rx="10" fill="#161B20" stroke="#E3862B" stroke-width="1.5"/>
      <text x="896" y="313" font-size="20" fill="#F4F6F8">alert sent</text>
      <text x="896" y="339" font-size="18" fill="#8B96A2">redacted · never the value</text>
    </g>
  </g>

  <g id="sd-conns">
    <g fill="none" stroke-width="2">
      <path d="M320 145 C 336 145, 340 145, 356 145" stroke="#1F93FF"/>
      <path d="M320 231 C 336 231, 340 231, 356 231" stroke="#1F93FF"/>
      <path d="M812 231 C 836 231, 838 145, 866 145" stroke="#3FB950"/>
      <path d="M812 231 C 836 231, 838 231, 866 231" stroke="#F85149"/>
      <path d="M1016 266 V 276" stroke="#E3862B"/>
    </g>
    <g fill="#1F93FF">
      <path d="M362 145 l -10 -6 v 12 z"/>
      <path d="M362 231 l -10 -6 v 12 z"/>
    </g>
    <path d="M872 145 l -10 -6 v 12 z" fill="#3FB950"/>
    <path d="M872 231 l -10 -6 v 12 z" fill="#F85149"/>
    <path d="M1016 282 l -6 -10 h 12 z" fill="#E3862B"/>
  </g>

  <text x="40" y="458" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" fill="#6E7A87">deleting the line in a later commit does not clear the check — the secret is still in the range</text>
</svg>
