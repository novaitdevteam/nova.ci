<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="448" viewBox="0 0 1200 448"
     role="img" aria-labelledby="e2eTitle e2eDesc">
  <title id="e2eTitle">The E2E workflow: one dispatch form, two targets, one report</title>
  <desc id="e2eDesc">A workflow_dispatch form in novatalks.tests picks a target. The lab target runs the suite against the shared stand while holding its lease; the ephemeral target boots the engine, UI, BotFlow, dialer and a mail server on the runner from image tags and tears them down afterwards. Either way the HTML report is published to R2 and linked from the notification.</desc>

  <rect width="1200" height="448" rx="20" fill="#0B0E11"/>

  <text x="40" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="19" letter-spacing="2.2" fill="#8B96A2">END-TO-END TESTS</text>
  <text x="1160" y="46" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" fill="#6E7A87">one form, two targets</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="40" y="80" width="300" height="308" rx="14" fill="#0F1317" stroke="#1F2429" stroke-width="1.5"/>
    <text x="64" y="114" font-size="18" letter-spacing="1.4" fill="#1F93FF">DISPATCH</text>
    <rect x="64" y="132" width="252" height="78" rx="10" fill="#161B20" stroke="#1F93FF" stroke-width="1.5"/>
    <text x="88" y="166" font-size="21" fill="#F4F6F8">novatalks.tests</text>
    <text x="88" y="194" font-size="18" fill="#8B96A2">workflow_dispatch</text>
    <text x="64" y="248" font-size="18" fill="#9AA6B2">target</text>
    <text x="64" y="274" font-size="18" fill="#6E7A87">lab | ephemeral</text>
    <text x="64" y="310" font-size="18" fill="#9AA6B2">test_tags</text>
    <text x="64" y="336" font-size="18" fill="#6E7A87">@smoke; empty = all</text>
    <text x="64" y="370" font-size="18" fill="#6E7A87">no tag route</text>

    <path d="M340 190 C 360 190, 360 172, 388 172" fill="none" stroke="#2A3138" stroke-width="2"/>
    <path d="M396 172 l -10 -6 v 12 z" fill="#2A3138"/>
    <path d="M340 190 C 360 190, 360 300, 388 300" fill="none" stroke="#2A3138" stroke-width="2"/>
    <path d="M396 300 l -10 -6 v 12 z" fill="#2A3138"/>

    <rect x="372" y="80" width="484" height="308" rx="14" fill="#0F1317" stroke="#1F2429" stroke-width="1.5"/>
    <text x="396" y="114" font-size="18" letter-spacing="1.4" fill="#6E7A87">TARGET</text>

    <rect x="396" y="132" width="436" height="100" rx="10" fill="#161B20" stroke="#2A3138" stroke-width="1.5"/>
    <text x="420" y="166" font-size="21" fill="#F4F6F8">lab</text>
    <text x="480" y="166" font-size="19" fill="#1F93FF">shared stand, default</text>
    <text x="420" y="194" font-size="18" fill="#8B96A2">lease held for the whole run</text>
    <text x="420" y="220" font-size="18" fill="#8B96A2">reset: prune | deep | drop</text>

    <rect x="396" y="250" width="436" height="124" rx="10" fill="#161B20" stroke="#2A3138" stroke-width="1.5"/>
    <text x="420" y="284" font-size="21" fill="#F4F6F8">ephemeral</text>
    <text x="548" y="284" font-size="19" fill="#1F93FF">one stack per run</text>
    <text x="420" y="312" font-size="18" fill="#8B96A2">engine, UI, BotFlow, dialer,</text>
    <text x="420" y="338" font-size="18" fill="#8B96A2">mail, from image tags</text>
    <text x="420" y="362" font-size="18" fill="#6E7A87">torn down afterwards</text>

    <path d="M832 182 C 852 182, 852 214, 880 214" fill="none" stroke="#2A3138" stroke-width="2"/>
    <path d="M832 306 C 852 306, 852 214, 880 214" fill="none" stroke="#2A3138" stroke-width="2"/>
    <path d="M912 214 l -10 -6 v 12 z" fill="#2A3138"/>

    <rect x="888" y="80" width="272" height="308" rx="14" fill="#0F1317" stroke="#1F2429" stroke-width="1.5"/>
    <text x="912" y="114" font-size="18" letter-spacing="1.4" fill="#6E7A87">REPORT</text>
    <rect x="912" y="132" width="224" height="130" rx="10" fill="#161B20" stroke="#3FB950" stroke-width="1.5"/>
    <text x="936" y="166" font-size="21" fill="#F4F6F8">R2</text>
    <text x="936" y="194" font-size="18" fill="#8B96A2">HTML report</text>
    <text x="936" y="220" font-size="18" fill="#6E7A87">reports/manual/</text>
    <text x="936" y="244" font-size="18" fill="#6E7A87">run/attempt</text>
    <rect x="912" y="280" width="224" height="84" rx="10" fill="#161B20" stroke="#2A3138" stroke-width="1.5"/>
    <text x="936" y="314" font-size="21" fill="#F4F6F8">notify</text>
    <text x="936" y="342" font-size="18" fill="#8B96A2">report + run link</text>
  </g>

  <text x="40" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" fill="#6E7A87">same build, same result on either: each starts from a defined account state</text>
</svg>
