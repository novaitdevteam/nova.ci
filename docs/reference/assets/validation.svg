<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="640" viewBox="0 0 1200 640"
     role="img" aria-labelledby="vaTitle vaDesc">
  <title id="vaTitle">One harness checks every workflow, action and doc change</title>
  <desc id="vaDesc">scripts/validate.sh parses every workflow and action YAML, checks whitespace with git diff --check, verifies the .agents and .claude skill mirror, runs actionlint as an advisory step, runs eight offline scenario self-checks — create-runner 26, secret-scan 50, secret-echo guard 23, SAST 43, deps-scan 42, dast-targets 78, dast-scan 153 and dast-api-scan 87 checks — and runs three guards: no direct scanner invocation, no direct notifier transport, and every self-reference pinned to @main. The same harness runs in CI on every pull request and push to main.</desc>

  <rect width="1200" height="640" rx="20" fill="#0B0E11"/>

  <text x="40" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="19" letter-spacing="2.2" fill="#8B96A2">VALIDATION</text>
  <text x="1160" y="46" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" fill="#6E7A87">scripts/validate.sh</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="40" y="76" width="300" height="528" rx="12" fill="#14181D" stroke="#1F93FF" stroke-width="1.5"/>
    <text x="64" y="118" font-size="20" fill="#F4F6F8">./scripts/validate.sh</text>
    <text x="64" y="150" font-size="18" fill="#8B96A2">or: make validate</text>
    <text x="64" y="182" font-size="18" fill="#6E7A87">run it after every edit</text>
    <text x="64" y="214" font-size="18" fill="#6E7A87">to a workflow, action</text>
    <text x="64" y="246" font-size="18" fill="#6E7A87">or documentation</text>
    <line x1="64" y1="270" x2="316" y2="270" stroke="#1C2228" stroke-width="1.5"/>
    <text x="64" y="304" font-size="19" fill="#F4F6F8">8 self-checks</text>
    <text x="64" y="332" font-size="19" fill="#F4F6F8">3 guards</text>
    <text x="64" y="364" font-size="18" fill="#6E7A87">STRICT_ACTIONLINT=1</text>
    <text x="64" y="392" font-size="18" fill="#6E7A87">enforces the advisory</text>
    <text x="64" y="418" font-size="18" fill="#6E7A87">actionlint step</text>

    <rect x="380" y="76" width="400" height="56" rx="10" fill="#161B20" stroke="#2A3138" stroke-width="1.5"/>
    <text x="404" y="111" font-size="19" fill="#C9D1D9">YAML parse — workflows + actions</text>

    <rect x="380" y="148" width="400" height="56" rx="10" fill="#161B20" stroke="#2A3138" stroke-width="1.5"/>
    <text x="404" y="183" font-size="19" fill="#C9D1D9">git diff --check — whitespace</text>

    <rect x="800" y="76" width="360" height="56" rx="10" fill="#161B20" stroke="#2A3138" stroke-width="1.5"/>
    <text x="824" y="111" font-size="19" fill="#C9D1D9">.agents ↔ .claude mirror</text>

    <rect x="800" y="148" width="360" height="56" rx="10" fill="#161B20" stroke="#2A3138" stroke-width="1.5"/>
    <text x="824" y="183" font-size="19" fill="#9AA6B2">actionlint — advisory</text>

    <text x="380" y="234" font-size="18" letter-spacing="1.6" fill="#6E7A87">8 OFFLINE SELF-CHECKS — docker/curl stubbed, no network</text>

    <g id="va-selfchecks">
      <rect x="380" y="250" width="183" height="66" rx="10" fill="#101519" stroke="#1F93FF" stroke-width="1.5"/>
      <text x="400" y="277" font-size="19" fill="#F4F6F8">create-runner</text>
      <text x="400" y="302" font-size="18" fill="#1F93FF">26 checks</text>

      <rect x="579" y="250" width="183" height="66" rx="10" fill="#101519" stroke="#2A3138" stroke-width="1.5"/>
      <text x="599" y="277" font-size="19" fill="#F4F6F8">secret-scan</text>
      <text x="599" y="302" font-size="18" fill="#9AA6B2">50 checks</text>

      <rect x="778" y="250" width="183" height="66" rx="10" fill="#101519" stroke="#2A3138" stroke-width="1.5"/>
      <text x="798" y="277" font-size="19" fill="#F4F6F8">secret-echo</text>
      <text x="798" y="302" font-size="18" fill="#9AA6B2">23 checks</text>

      <rect x="977" y="250" width="183" height="66" rx="10" fill="#101519" stroke="#2A3138" stroke-width="1.5"/>
      <text x="997" y="277" font-size="19" fill="#F4F6F8">SAST</text>
      <text x="997" y="302" font-size="18" fill="#9AA6B2">43 checks</text>

      <rect x="380" y="332" width="183" height="66" rx="10" fill="#101519" stroke="#2A3138" stroke-width="1.5"/>
      <text x="400" y="359" font-size="19" fill="#F4F6F8">deps-scan</text>
      <text x="400" y="384" font-size="18" fill="#9AA6B2">42 checks</text>

      <rect x="579" y="332" width="183" height="66" rx="10" fill="#101519" stroke="#2A3138" stroke-width="1.5"/>
      <text x="599" y="359" font-size="19" fill="#F4F6F8">dast-targets</text>
      <text x="599" y="384" font-size="18" fill="#9AA6B2">78 checks</text>

      <rect x="778" y="332" width="183" height="66" rx="10" fill="#101519" stroke="#1F93FF" stroke-width="1.5"/>
      <text x="798" y="359" font-size="19" fill="#F4F6F8">dast-scan</text>
      <text x="798" y="384" font-size="18" fill="#1F93FF">153 checks</text>

      <rect x="977" y="332" width="183" height="66" rx="10" fill="#101519" stroke="#2A3138" stroke-width="1.5"/>
      <text x="997" y="359" font-size="19" fill="#F4F6F8">dast-api-scan</text>
      <text x="997" y="384" font-size="18" fill="#9AA6B2">87 checks</text>
    </g>

    <text x="380" y="436" font-size="18" letter-spacing="1.6" fill="#6E7A87">3 GUARDS — fail the harness on a direct call</text>

    <g id="va-guards">
      <rect x="380" y="452" width="249" height="52" rx="10" fill="#161B20" stroke="#E3862B" stroke-width="1.5"/>
      <text x="404" y="484" font-size="19" fill="#F4F6F8">scanner-invocation</text>

      <rect x="649" y="452" width="249" height="52" rx="10" fill="#161B20" stroke="#E3862B" stroke-width="1.5"/>
      <text x="673" y="484" font-size="19" fill="#F4F6F8">notifier-transport</text>

      <rect x="918" y="452" width="242" height="52" rx="10" fill="#161B20" stroke="#E3862B" stroke-width="1.5"/>
      <text x="942" y="484" font-size="19" fill="#F4F6F8">self-reference-pins</text>
    </g>

    <text x="380" y="528" font-size="18" fill="#6E7A87">no workflow invokes Gitleaks, Semgrep, ZAP or OSV-Scanner directly</text>
    <text x="380" y="552" font-size="18" fill="#6E7A87">no workflow reaches the Telegram or Google Chat API directly</text>
    <text x="380" y="576" font-size="18" fill="#6E7A87">every novaitdevteam/nova.ci self-reference pins @main</text>
  </g>

  <text x="40" y="612" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" fill="#6E7A87">ci-self-validate.yaml runs the same harness on every pull request and push to main</text>
</svg>
